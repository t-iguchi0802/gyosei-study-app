<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ITパスポート スマホ学習</title>
  <link rel="stylesheet" href="exam-app.css">
</head>
<body>
  <main class="app">
    <header class="hero"><div class="hero-row"><div><p class="label" id="label"></p><h1 id="title"></h1><p class="goal" id="goal"></p></div><button class="reset" id="reset" type="button">リセット</button></div></header>
    <section class="metrics"><div class="metric"><span>理解度</span><strong id="mastery">0%</strong></div><div class="metric"><span>一周</span><strong id="done">0%</strong></div><div class="metric"><span>復習</span><strong id="due">0</strong></div><div class="metric"><span>連続</span><strong id="streak">0</strong></div></section>
    <section class="coach" id="coach"></section>
    <nav class="tabs"><button class="tab active" type="button" data-view="learn">問題</button><button class="tab" type="button" data-view="cards">要点</button><button class="tab" type="button" data-view="progress">進捗</button></nav>
    <section class="view active" id="learnView">
      <div class="controls"><label>分野<select id="category"></select></label><label>出題<select id="mode"><option value="first">一周優先</option><option value="weak">苦手優先</option><option value="due">復習優先</option><option value="all">全問</option></select></label></div>
      <div class="audio-tools"><button id="audioToggle" type="button">音声OFF</button><button id="readQuestion" type="button">問題を聞く</button><button id="stopAudio" type="button">停止</button><div class="speed-control"><input id="speed" type="range" min="0.8" max="3" step="0.1"><span id="speedLabel">1.4倍</span></div></div>
      <article class="question panel"><div class="meta"><span id="qCat"></span><span id="qStats"></span></div><p class="question-text" id="qText"></p><div class="choices" id="choices"></div><div class="answer hidden" id="answer"><strong id="result"></strong><span id="explain"></span></div></article>
      <div class="actions"><button class="primary" id="next" type="button">次の問題</button></div>
    </section>
    <section class="view" id="cardsView"><div class="controls"><label>分野<select id="cardCategory"></select></label></div><article class="card panel"><div class="meta"><span id="flashCat"></span></div><p class="card-front" id="flashFront"></p><div class="card-back hidden" id="flashBack"></div></article><div class="actions"><button id="prevCard" type="button">前へ</button><button id="showCard" type="button">答え</button><button class="primary" id="nextCard" type="button">次へ</button></div></section>
    <section class="view" id="progressView"><div class="subject-list" id="subjectList"></div><div class="progress-list" id="progressList"></div></section>
  </main>
  <script src="multi-exam-question-bank.js"></script>
  <script>
    window.examAppConfig = {
      exam: "ITパスポート",
      label: "用語暗記と頻出計算",
      title: "ITパスポート",
      goal: "ストラテジ、マネジメント、テクノロジを一周し、用語・セキュリティ・基本計算を固めます。",
      theme: "it",
      questionIds: [
        "ip-strategy-001", "ip-strategy-002", "ip-strategy-003", "ip-strategy-005", "ip-strategy-006",
        "ip-strategy-007", "ip-strategy-008", "ip-strategy-009", "ip-strategy-010", "ip-strategy-011",
        "ip-management-001", "ip-management-002", "ip-management-003", "ip-management-005", "ip-management-006",
        "ip-management-007", "ip-management-009", "ip-management-010", "ip-management-011", "ip-management-012",
        "ip-tech-002", "ip-tech-003", "ip-tech-004", "ip-tech-005", "ip-tech-007",
        "ip-tech-008", "ip-tech-009", "ip-tech-011", "ip-tech-013", "ip-tech-017"
      ]
    };
  </script>
  <script src="exam-app.js"></script>
</body>
</html>
