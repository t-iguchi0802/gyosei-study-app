<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#176b5b">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>行政法スマホ学習</title>
  <style>
    :root {
      --bg: #f4f6f1;
      --ink: #152019;
      --muted: #617067;
      --line: #dde4dc;
      --panel: #ffffff;
      --accent: #176b5b;
      --accent2: #9a5b22;
      --bad: #a43d2a;
      --good: #e8f3ee;
      --note: #fff6d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 10px 88px;
    }
    .hero {
      position: sticky;
      top: 0;
      z-index: 3;
      margin: 0 -10px 10px;
      padding: 12px 10px 10px;
      background: rgba(244, 246, 241, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .label {
      margin: 0 0 2px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    button, select {
      min-height: 46px;
      font: inherit;
      border-radius: 8px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }
    .reset {
      min-width: 66px;
      padding: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }
    .metric {
      min-height: 70px;
      padding: 9px 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .metric strong {
      display: block;
      margin-top: 7px;
      font-size: 22px;
      line-height: 1;
    }
    .coach {
      margin-bottom: 10px;
      padding: 11px 12px;
      background: var(--note);
      border: 1px solid #ead687;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.55;
    }
    .tabs {
      position: sticky;
      top: 74px;
      z-index: 4;
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 0 0 10px;
      padding: 7px;
      background: rgba(244, 246, 241, 0.97);
      border: 1px solid var(--line);
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    .tab {
      min-height: 48px;
      padding: 6px 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .view { display: none; }
    .view.active { display: block; }
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .study-log {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .study-log button {
      background: #fffaf0;
      border-color: #ead687;
      color: #5f4518;
      font-weight: 800;
    }
    .resume-tools {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .resume-tools button,
    .answer-actions button {
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .answer-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .tip.focused {
      outline: 3px solid var(--accent);
      background: #f3fbf7;
    }
    .audio-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .audio-tools button {
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .global-audio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 10px;
    }
    .speed-control {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .speed-control input {
      width: 100%;
    }
    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .question {
      padding: 14px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 19px;
      line-height: 1.48;
      letter-spacing: 0;
    }
    .choices {
      display: grid;
      gap: 9px;
    }
    .choice {
      width: 100%;
      min-height: 54px;
      padding: 12px;
      text-align: left;
      line-height: 1.45;
    }
    .choice.correct { background: var(--good); border-color: var(--accent); }
    .choice.wrong { background: #fff0ea; border-color: var(--bad); }
    .answer {
      margin-top: 12px;
      padding: 12px;
      background: #fafbf8;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.55;
    }
    .answer p { margin: 0 0 8px; }
    .primary {
      width: 100%;
      margin-top: 4px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 800;
    }
    .card {
      min-height: 280px;
      padding: 16px;
    }
    .card .cat {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }
    .back {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 17px;
      line-height: 1.65;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .wide { grid-column: 1 / -1; }
    .progress-list, .tips {
      display: grid;
      gap: 9px;
    }
    .subject-map {
      display: grid;
      gap: 9px;
      margin-bottom: 10px;
    }
    .subject-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .subject-row strong {
      display: block;
      margin-bottom: 8px;
    }
    .subject-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .subject-stats span {
      padding: 5px 4px;
      background: #f5f7f2;
      border-radius: 6px;
      text-align: center;
    }
    .subject-row button {
      min-width: 64px;
      align-self: center;
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .lecture-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .lecture-actions button {
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .lecture-summary {
      padding: 12px;
      background: #fffaf0;
      border: 1px solid #ead687;
      border-radius: 8px;
      line-height: 1.55;
    }
    .lecture-summary strong {
      display: block;
      margin-bottom: 6px;
    }
    .lecture-mode {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 9px;
    }
    .lecture-mode button {
      background: var(--panel);
      color: var(--muted);
      font-weight: 800;
    }
    .lecture-mode button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .progress-item, .tip {
      padding: 13px;
      line-height: 1.55;
    }
    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
      font-weight: 800;
    }
    .bar {
      height: 10px;
      overflow: hidden;
      background: #e8ece5;
      border-radius: 999px;
    }
    .bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .small {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .hidden { display: none; }
    @media (max-width: 350px) {
      h1 { font-size: 20px; }
      h2 { font-size: 17px; }
      .metric strong { font-size: 19px; }
      .tab { font-size: 12px; }
      .filters { grid-template-columns: 1fr; }
      .study-log { grid-template-columns: 1fr; }
      .resume-tools { grid-template-columns: 1fr; }
      .audio-tools { grid-template-columns: 1fr; }
      .global-audio { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-row">
        <div>
          <p class="label">行政書士試験</p>
          <h1>行政法スマホ学習</h1>
        </div>
        <button class="reset" id="resetButton" type="button">リセット</button>
      </div>
    </header>

    <section class="metrics" aria-label="学習状況">
      <div class="metric"><span>理解度</span><strong id="masteryText">0%</strong></div>
      <div class="metric"><span>復習</span><strong id="dueText">0</strong></div>
      <div class="metric"><span>連続</span><strong id="streakText">0</strong></div>
      <div class="metric"><span>一周</span><strong id="loggedText">0%</strong></div>
    </section>

    <section class="coach" id="coachText" aria-live="polite"></section>

    <section class="global-audio" aria-label="音声コントロール">
      <button id="audioToggleButton" type="button">音声 ON</button>
      <button id="stopAudioButton" type="button">音声を止める</button>
      <label class="speed-control">
        読む速さ
        <span id="speedText">1.0倍</span>
        <input id="speedRange" type="range" min="0.8" max="3" step="0.1" value="1">
      </label>
    </section>

    <nav class="tabs" aria-label="メニュー">
      <button class="tab active" type="button" data-view="learn">問題</button>
      <button class="tab" type="button" data-view="cards">要点</button>
      <button class="tab" type="button" data-view="progress">進捗</button>
      <button class="tab" type="button" data-view="guide">講義</button>
    </nav>

    <section class="view active" id="learnView">
      <div class="filters">
        <label>分野<select id="categoryFilter"></select></label>
        <label>出題<select id="modeFilter">
          <option value="due">復習優先</option>
          <option value="first">一周優先</option>
          <option value="weak">苦手優先</option>
          <option value="new">未学習優先</option>
          <option value="all">全範囲</option>
        </select></label>
      </div>
      <div class="resume-tools">
        <button id="resumeButton" type="button">前回の続きから始める</button>
      </div>
      <div class="study-log">
        <button id="log10Button" type="button">10分勉強した</button>
        <button id="log30Button" type="button">30分勉強した</button>
      </div>
      <div class="audio-tools">
        <button id="readQuestionButton" type="button">問題を聞く</button>
      </div>
      <article class="question panel">
        <div class="meta">
          <span id="questionCategory"></span>
          <span id="questionStats"></span>
        </div>
        <h2 id="questionText"></h2>
        <div class="choices" id="choices"></div>
        <div class="answer hidden" id="answerPanel">
          <p id="answerResult"></p>
          <p id="answerExplain"></p>
          <div class="answer-actions">
            <button id="relatedLectureButton" type="button">関連講義を読む</button>
          </div>
          <button class="primary" id="nextButton" type="button">次の問題</button>
        </div>
      </article>
    </section>

    <section class="view" id="cardsView">
      <div class="filters">
        <label class="wide">分野<select id="cardCategoryFilter"></select></label>
      </div>
      <article class="card panel">
        <p class="cat" id="flashCategory"></p>
        <h2 id="flashFront"></h2>
        <p class="back hidden" id="flashBack"></p>
      </article>
      <div class="row">
        <button id="showBackButton" type="button">答えを見る</button>
        <button id="nextCardButton" type="button">次へ</button>
        <button class="wide" id="prevCardButton" type="button">前へ</button>
      </div>
    </section>

    <section class="view" id="progressView">
      <div class="subject-map" id="subjectMap"></div>
      <div class="progress-list" id="progressList"></div>
    </section>

    <section class="view" id="guideView">
      <div class="audio-tools">
        <button id="readGuideButton" type="button">表示中の講義を聞く</button>
      </div>
      <div class="lecture-mode" id="lectureModeButtons">
        <button class="active" type="button" data-lecture-mode="basic">基本編</button>
        <button type="button" data-lecture-mode="advanced">応用編</button>
        <button type="button" data-lecture-mode="all">全件</button>
      </div>
      <div class="tips" id="lectureList"></div>
    </section>

  </main>

  <script>
    const categories = ["行政手続法", "行政不服審査法", "行政事件訴訟法", "国家賠償法", "地方自治法", "行政法総論", "民法", "憲法", "基礎知識", "商法・会社法", "基礎法学", "記述式"];
    const planHours = {
      "行政手続法": 10,
      "行政不服審査法": 10,
      "行政事件訴訟法": 16,
      "国家賠償法": 7,
      "地方自治法": 10,
      "行政法総論": 7,
      "民法": 55,
      "憲法": 16,
      "基礎知識": 25,
      "商法・会社法": 8,
      "基礎法学": 4,
      "記述式": 32
    };
    const questions = [
      q("t01", "行政手続法", "審査基準が使われる場面はどれか。", ["不利益処分", "申請に対する処分", "行政指導", "住民訴訟"], 1, "審査基準は申請に対する処分。処分基準は不利益処分。"),
      q("t02", "行政手続法", "処分基準の公表について正しいものはどれか。", ["必ず公にする", "公にするよう努める", "申請者だけに通知する", "裁判所だけに提出する"], 1, "処分基準は公にするよう努める。審査基準は原則として公にする。"),
      q("t03", "行政手続法", "行政指導について正しいものはどれか。", ["相手方は必ず従う", "従わないことを理由に不利益取扱いできる", "任意の協力を求める行為である", "必ず聴聞が必要"], 2, "行政指導は任意。従わないことを理由とする不利益取扱いは禁止。"),
      q("t04", "行政手続法", "届出で手続上の義務が履行される時点はどれか。", ["受理印を押した時", "審査が終わった時", "形式上の要件を満たした届出が行政庁に到達した時", "許可通知が出た時"], 2, "届出は、形式要件を満たして行政庁に到達した時に義務履行となる。"),
      q("t05", "行政手続法", "許認可取消しなど重大な不利益処分で原則必要な手続はどれか。", ["聴聞", "住民監査請求", "再審査請求", "事情判決"], 0, "許認可取消しなど重大な不利益処分では聴聞。その他は弁明の機会付与が中心。"),
      q("t06", "行政手続法", "意見公募手続が問題となる場面はどれか。", ["命令等を定める場合", "国家賠償を請求する場合", "取消訴訟を提起する場合", "住民訴訟を提起する場合"], 0, "命令等を定める場合に、国民の意見提出機会を設ける制度。"),
      q("f01", "行政不服審査法", "審査請求期間として正しいものはどれか。", ["処分を知った日から6か月", "処分を知った日の翌日から3か月", "処分の日から3年", "期間制限なし"], 1, "処分を知った日の翌日から3か月以内。客観的には処分日の翌日から1年以内。"),
      q("f02", "行政不服審査法", "審査請求と処分効力の関係として正しいものはどれか。", ["当然に効力が止まる", "原則として効力は止まらない", "必ず裁判所が止める", "処分庁の同意が必要"], 1, "審査請求しても処分の効力、執行、手続続行は原則妨げられない。"),
      q("f03", "行政不服審査法", "審査請求が不適法な場合の裁決はどれか。", ["認容", "棄却", "却下", "事情判決"], 2, "不適法なら却下。理由なしなら棄却、理由ありなら認容。"),
      q("f04", "行政不服審査法", "不作為について正しいものはどれか。", ["審査請求できない", "審査請求できる", "住民訴訟でしか争えない", "国家賠償でしか争えない"], 1, "行政庁の不作為についても審査請求できる。"),
      q("f05", "行政不服審査法", "再調査の請求について正しいものはどれか。", ["常に審査請求より先に必要", "法律に定めがある場合にできる", "裁判所に対して行う", "取消訴訟の一種"], 1, "再調査の請求は、法律に定めがある場合に限って認められる。"),
      q("f06", "行政不服審査法", "審理員について正しいものはどれか。", ["原則として審理手続を行う", "必ず裁判官である", "取消判決をする", "条例を制定する"], 0, "行政不服審査法では、原則として審理員が審理手続を行う。"),
      q("j01", "行政事件訴訟法", "取消訴訟の出訴期間として正しいものはどれか。", ["知った日から6か月、処分の日から1年", "知った日の翌日から3か月だけ", "処分の日から5年", "期間制限なし"], 0, "取消訴訟は、処分を知った日から6か月以内、処分の日から1年以内。"),
      q("j02", "行政事件訴訟法", "取消訴訟の被告として原則正しいものはどれか。", ["公務員個人", "処分庁の所属する国または公共団体", "審理員", "行政不服審査会"], 1, "取消訴訟の被告は、処分庁または裁決庁の所属する国または公共団体。"),
      q("j03", "行政事件訴訟法", "裁決取消訴訟で原則として主張できる違法はどれか。", ["原処分のすべての違法", "裁決固有の瑕疵", "契約不適合", "行政指導の不当性だけ"], 1, "裁決取消訴訟では原則として裁決固有の瑕疵だけを主張する。"),
      q("j04", "行政事件訴訟法", "取消訴訟で最初に問題となりやすい要件はどれか。", ["処分性", "相続分", "株式併合", "契約不適合"], 0, "取消訴訟は、行政庁の処分その他公権力の行使にあたる行為かが出発点。"),

    lectures.push(
      lecture("行政手続法", "審査基準・標準処理期間", "申請に対する処分では、行政庁が審査基準を定め、原則として公にします。標準処理期間を定めたときは、公にしておくよう努めます。申請拒否処分では、原則として理由提示が必要です。審査基準、標準処理期間、理由提示をセットで覚えます。"),
      lecture("行政手続法", "聴聞と弁明", "不利益処分では、重大な処分なら聴聞、それ以外は弁明の機会付与が中心です。許認可の取消し、資格や地位の剥奪などは聴聞が出やすいです。聴聞は重い手続、弁明は軽い手続、とまず整理してください。"),
      lecture("行政不服審査法", "執行停止", "審査請求をしても、処分の効力や執行は原則として止まりません。止めたい場合は執行停止を考えます。行政事件訴訟法の執行停止と混同しやすいので、どちらも、処分は原則止まらない、必要があれば止める手続がある、と理解します。"),
      lecture("行政不服審査法", "審理員と審査会", "行政不服審査法では、原則として審理員が審理手続を行います。その後、行政不服審査会などの第三者機関がチェックする場面があります。処分をした側だけで終わらせないための公正さの仕組みです。"),
      lecture("行政事件訴訟法", "処分性", "取消訴訟は、処分性がなければ始まりません。処分性とは、行政庁の公権力の行使として、国民の権利義務に直接具体的な影響を与えることです。行政指導や内部行為は、原則として処分性が問題になります。"),
      lecture("行政事件訴訟法", "原告適格と訴えの利益", "原告適格は、その人に法律上保護された利益があるかで判断します。訴えの利益は、取消判決によって回復される利益が残っているかです。誰が争えるかが原告適格、今も争う意味があるかが訴えの利益です。"),
      lecture("行政事件訴訟法", "義務付け訴訟", "義務付け訴訟は、行政庁に一定の処分または裁決をすべきことを命じる訴訟です。申請型と非申請型があります。申請したのに拒否された、または応答がない場合は、取消訴訟や不作為の違法確認訴訟との組み合わせも意識します。"),
      lecture("行政事件訴訟法", "差止訴訟", "差止訴訟は、行政庁に一定の処分や裁決をさせないための訴訟です。重大な損害を生ずるおそれがあり、その損害を避けるため他に適当な方法がないことが重要です。重大な損害、補充性、処分前の救済という言葉で押さえます。"),
      lecture("行政事件訴訟法", "取消判決の効力", "取消判決には拘束力があります。行政庁は判決の趣旨に従って行動しなければなりません。第三者効も重要で、取消判決の効力は第三者にも及びます。事情判決は、処分は違法でも取消しが公共の福祉に適合しない場合の制度です。"),
      lecture("国家賠償法", "公務員個人の責任", "国賠法1条では、被害者に対して賠償責任を負うのは国または公共団体です。判例上、公務員個人は被害者に直接賠償責任を負いません。ただし、国または公共団体は、公務員に故意または重大な過失がある場合に求償できます。"),
      lecture("国家賠償法", "営造物責任", "国賠法2条の瑕疵とは、公の営造物が通常有すべき安全性を欠いていることです。道路、河川、学校施設などが典型です。費用、技術水準、危険の予見可能性なども判断要素になります。"),
      lecture("地方自治法", "条例と規則", "条例は議会の議決を経て制定され、法令に違反しない限り制定できます。規則は地方公共団体の長が制定します。条例は議会、規則は長、という役割分担を押さえます。"),
      lecture("地方自治法", "議会と長", "地方公共団体の議会は、条例制定、予算議決、決算認定などを行います。長は執行機関として事務を管理執行します。長には再議、専決処分などもありますが、最初は議会は議決、長は執行という骨格を押さえます。"),
      lecture("地方自治法", "住民監査請求と住民訴訟", "住民監査請求は、違法または不当な財務会計行為を対象にできます。住民訴訟は、違法な財務会計行為を対象とし、住民監査請求の前置が必要です。不当も含むのが監査請求、違法に絞られるのが住民訴訟です。"),
      lecture("行政法総論", "行政上の強制執行", "行政上の強制執行には、代執行、執行罰、直接強制、強制徴収があります。代執行は、代替的作為義務を行政庁が代わって行い費用を徴収する制度です。即時強制は、義務の存在を前提としない点で強制執行と区別します。"),
      lecture("民法", "意思表示", "意思表示では、心裡留保、虚偽表示、錯誤、詐欺、強迫を整理します。心裡留保は原則有効、相手方が真意でないことを知り又は知ることができたときは無効。詐欺と強迫は取消し。第三者保護の有無が頻出です。"),
      lecture("民法", "代理", "代理では、代理権、顕名、代理行為、効果帰属を押さえます。無権代理では、本人は追認または追認拒絶ができます。相手方には催告権や取消権が問題になります。表見代理は、本人側の帰責性と相手方の善意無過失が軸です。"),
      lecture("民法", "時効", "時効は、完成、援用、更新、完成猶予を押さえます。時効は完成しただけではなく、援用して初めて効果が確定します。時効完成後に債務を承認すると、信義則上、時効援用権を失うことがあります。"),
      lecture("民法", "物権変動", "不動産物権変動は、当事者間では意思表示で効力が生じますが、第三者に対抗するには登記が必要です。取消し、解除、取得時効などで登記の要否が問われます。民法では、誰が第三者かを丁寧に見ます。"),
      lecture("民法", "債務不履行と解除", "債務不履行では、履行遅滞、履行不能、不完全履行を整理します。解除は、催告解除が原則ですが、契約目的を達成できない場合など無催告解除が認められる場面もあります。解除しても、損害賠償請求は妨げられません。"),
      lecture("民法", "賃貸借", "賃貸借では、賃料不払い、修繕、転貸、敷金、解除が出やすいです。賃料不払いで解除する場合は、催告だけでなく、信頼関係が破壊されたかが問題になります。記述式でも、催告、相当期間、解除、明渡しが書けるようにします。"),
      lecture("民法", "不法行為", "不法行為は、故意または過失、権利または法律上保護される利益の侵害、損害、因果関係が要件です。使用者責任、共同不法行為、工作物責任も頻出ですが、まず基本不法行為の要件を落とさないことが大切です。"),
      lecture("民法", "相続", "相続では、相続人、相続分、遺産分割、遺言、遺留分、相続放棄を押さえます。行政書士試験では細かい親族相続に深入りしすぎず、基本的な相続人と相続分、放棄の効果を拾います。"),
      lecture("憲法", "表現の自由", "表現の自由では、検閲禁止、事前抑制、明確性、知る権利、報道の自由を押さえます。表現の自由は民主政の過程に関わるため重要です。規制目的と規制手段のバランスを判例の結論で確認します。"),
      lecture("憲法", "経済的自由", "職業選択の自由や財産権では、規制目的によって審査の厳しさが変わります。消極目的規制と積極目的規制の違いが有名です。学説に深入りせず、判例の結論を短く押さえます。"),
      lecture("憲法", "統治", "統治では、国会、内閣、裁判所を条文中心に押さえます。国会は国権の最高機関、唯一の立法機関。内閣は行政権を担い、国会に対して連帯責任を負います。裁判所は司法権を担い、違憲審査権を持ちます。"),
      lecture("基礎知識", "個人情報保護", "個人情報保護では、個人情報、個人データ、保有個人データ、要配慮個人情報を区別します。特定個人を識別できる情報が個人情報です。本人同意、第三者提供、安全管理措置もよく出ます。"),
      lecture("基礎知識", "情報通信", "情報通信では、フィッシング、ランサムウェア、二要素認証、暗号化、Cookie、クラウド、AIなどを押さえます。用語問題は短時間で点にしやすいため、音声で反復する価値があります。"),
      lecture("基礎知識", "文章理解", "文章理解は、知識ではなく読み方の問題です。接続詞、指示語、段落の役割を追い、本文に根拠がある選択肢を選びます。自分の意見に近い選択肢を選ばないことが重要です。"),
      lecture("基礎知識", "改正行政書士法", "令和8年度で注意したいのは、2026年1月1日施行の改正行政書士法です。行政書士の使命、職責、デジタル社会への対応、特定行政書士、業務範囲、無資格者規制、両罰規定を直前に確認します。"),
      lecture("商法・会社法", "株式会社の設立", "株式会社の設立では、発起人、定款、出資、設立時役員を押さえます。発起人は1人でもよく、定款作成は必要です。細かい手続より、基本用語と機関設計を優先します。"),
      lecture("商法・会社法", "株式と機関", "株式では、株主平等原則、譲渡制限株式、株主総会を押さえます。機関では、取締役、取締役会、監査役、会計参与などの役割を確認します。配点が小さいので、基本問題だけ取りに行きます。"),
      lecture("商法・会社法", "取締役の責任", "取締役は会社に対して善管注意義務と忠実義務を負います。競業取引や利益相反取引では承認が重要です。任務懈怠責任や第三者に対する責任は頻出ですが、深入りしすぎないようにします。"),
      lecture("基礎法学", "法の分類", "基礎法学では、公法と私法、実体法と手続法、一般法と特別法、強行法規と任意法規を確認します。特別法は一般法に優先する、上位法は下位法に優先する、という基本ルールが大切です。"),
      lecture("基礎法学", "裁判制度", "民事訴訟は私人間の権利義務の確定、刑事訴訟は国家刑罰権の実現が目的です。行政事件訴訟は行政を裁判所で争う制度です。用語の違いだけで得点できることがあります。")
    );
    lectures.push(
      lecture("行政事件訴訟法", "出訴期間と審査請求前置", "取消訴訟の出訴期間は、処分を知った日から6か月以内、処分の日から1年以内です。審査請求前置は原則不要ですが、個別法で前置が要求される場合があります。行政不服審査法の3か月と混同しないように、訴訟は6か月、審査請求は3か月と整理します。"),
      lecture("行政事件訴訟法", "不作為の違法確認訴訟", "不作為の違法確認訴訟は、法令に基づく申請に対して、行政庁が相当期間内に処分または裁決をしない場合に使います。何もしない行政を裁判所で争う制度です。義務付け訴訟と一緒に問われやすいので、応答がない、相当期間、申請という言葉に反応します。"),
      lecture("行政事件訴訟法", "当事者訴訟・民衆訴訟・機関訴訟", "当事者訴訟は、公法上の法律関係を争う訴訟です。民衆訴訟は、選挙訴訟や住民訴訟のように、法律に定めがある場合だけ認められます。機関訴訟は、国や公共団体の機関同士の争いです。主観訴訟と客観訴訟の区別が重要です。"),
      lecture("民法", "債権譲渡", "債権譲渡では、譲渡人から債務者への通知または債務者の承諾が対抗要件です。第三者対抗要件では、確定日付ある証書による通知または承諾が必要です。誰に対抗するのか、債務者か第三者かを分けて考えます。"),
      lecture("民法", "契約不適合責任", "売買で目的物が契約内容に適合しない場合、買主は追完請求、代金減額請求、損害賠償請求、解除を検討できます。まず追完、それが無理なら代金減額、重大なら解除という流れで理解します。旧瑕疵担保責任という言葉に引っ張られないようにします。"),
      lecture("民法", "相殺", "相殺は、互いに同種の債権を持つ場合に、一方的意思表示で対当額を消滅させる制度です。自働債権と受働債権を区別します。相殺禁止や差押えとの関係もありますが、まず同種債権、弁済期、一方的意思表示を押さえます。"),
      lecture("民法", "保証", "保証では、主債務と保証債務の関係を押さえます。保証債務は主債務に付従します。連帯保証では、催告の抗弁権や検索の抗弁権がありません。行政書士試験では、保証人がどこまで責任を負うかを聞かれます。"),
      lecture("民法", "共有", "共有では、保存行為、管理行為、変更行為を区別します。保存行為は各共有者が単独でできます。管理行為は持分価格の過半数。変更行為は原則として全員の同意が必要です。この数字と権限の違いが頻出です。"),
      lecture("民法", "抵当権", "抵当権は、債務者または第三者が占有を移さずに不動産を担保に供する担保物権です。付従性、随伴性、物上代位、法定地上権などが出ます。200時間戦略では、まず抵当権は占有を移さない担保、物上代位、法定地上権を押さえます。"),
      lecture("憲法", "法の下の平等", "法の下の平等では、合理的な理由のない差別が禁止されます。判例は、区別の目的や手段に合理性があるかを見ます。尊属殺重罰規定、議員定数不均衡、非嫡出子相続分などの判例が有名です。"),
      lecture("憲法", "適正手続と人身の自由", "適正手続では、刑罰や身体拘束に関する手続保障が問題になります。令状主義、黙秘権、弁護人依頼権、拷問禁止などを条文ベースで押さえます。細かい刑訴法知識ではなく、憲法上の保障として理解します。"),
      lecture("憲法", "財産権", "財産権は保障されますが、公共の福祉による制約を受けます。正当な補償の要否が問題になります。条例による制約、損失補償、規制と補償の関係を短く押さえます。"),
      lecture("基礎知識", "行政書士法の業務", "行政書士の業務は、官公署に提出する書類、権利義務または事実証明に関する書類の作成、提出手続代理、相談などが中心です。無資格者規制や業務制限も基礎知識で狙われます。改正法では使命や職責の文言にも注意します。"),
      lecture("基礎知識", "情報セキュリティ", "情報セキュリティでは、機密性、完全性、可用性を押さえます。マルウェア、ランサムウェア、フィッシング、標的型攻撃、ゼロデイ攻撃、二要素認証、バックアップが頻出です。用語を聞いて説明できる状態にします。"),
      lecture("基礎知識", "政治・経済・社会", "政治経済社会は範囲が広いので、深追いしません。行政、地方自治、財政、社会保障、選挙、国際機関などの基本語だけ拾います。時事は直前期に薄く確認し、文章理解と個人情報で安定点を取りに行きます。"),
      lecture("記述式", "行政法記述の書き方", "行政法記述は、訴訟類型、被告、要件、主張内容を短く書きます。誰が、誰を被告として、どの訴訟を提起し、何を主張するか、という順番で考えます。取消訴訟、義務付け訴訟、差止訴訟、執行停止、裁決固有の瑕疵が重要です。"),
      lecture("記述式", "民法記述の書き方", "民法記述は、要件と効果を40字前後で書きます。詐欺なら取り消せる、代理なら本人に効果帰属するか、賃貸借なら催告解除と明渡し、不法行為なら損害賠償請求、という形で、結論を先に決めてから要件を添えます。"),
      lecture("記述式", "部分点の取り方", "記述式は完璧な文章より、キーワードを落とさないことが大切です。取消訴訟、被告、裁決固有の瑕疵、重大な損害、緊急の必要、催告、解除、損害賠償など、採点されやすい語を入れます。わからない問題でも、制度名と効果を書いて部分点を狙います。")
    );
    lectures.push(
      lecture("行政手続法", "理由提示の狙い", "理由提示は、行政庁の判断を慎重にさせ、相手方に不服申立てや訴訟の準備をさせるための制度です。申請拒否処分でも不利益処分でも原則として理由提示が必要です。理由が抽象的すぎると違法が問題になります。"),
      lecture("行政手続法", "行政指導の限界", "行政指導は任意ですが、実際には圧力になりやすいので限界があります。相手方が行政指導に従わないことを理由に不利益取扱いをしてはいけません。また、許認可等の権限に関連して行政指導をする場合、相手方に誤解を与えない配慮が必要です。"),
      lecture("行政手続法", "申請処分の処理手順", "申請があったら、行政庁は遅滞なく審査を開始します。形式上の不備があれば補正を求めるか、拒否処分をします。申請者に不利な処分をする場合でも、申請拒否は不利益処分ではないため、聴聞や弁明ではなく理由提示が中心になります。"),
      lecture("行政手続法", "命令等と意見公募", "意見公募手続は、行政庁が命令等を定める場合に、案と関連資料を公示して意見を求める手続です。処分や行政指導とは違い、一般的ルールを作る場面です。命令等、案の公示、意見提出、結果公示をセットで覚えます。"),

      lecture("行政不服審査法", "審査請求の利益", "審査請求は、裁判より簡易迅速に行政内部で争える制度です。違法だけでなく不当も争える点が特徴です。取消訴訟は原則として違法性を争うため、不服審査の方が行政内部の再検討として広い意味を持ちます。"),
      lecture("行政不服審査法", "処分についての審査請求", "処分についての審査請求では、処分を取り消す、変更する、または一定の処分をすべきことを命じる裁決が問題になります。不適法なら却下、理由がなければ棄却、理由があれば認容です。結論語を間違えないことが重要です。"),
      lecture("行政不服審査法", "不作為についての審査請求", "不作為についての審査請求は、法令に基づく申請に対して行政庁が相当期間内に何もしない場合に使います。審査庁は、不作為が違法または不当なら、一定の処分をすべき旨を命じるなどの裁決をします。"),
      lecture("行政不服審査法", "審査請求と訴訟の違い", "審査請求は行政内部の手続、取消訴訟は裁判所の手続です。審査請求期間は処分を知った日の翌日から3か月、取消訴訟は処分を知った日から6か月です。不当まで見られるのが審査請求、違法性判断が中心なのが取消訴訟です。"),

      lecture("行政事件訴訟法", "処分性の判断例", "処分性では、行政庁の行為が国民の権利義務に直接具体的な法的効果を与えるかを見ます。行政指導、通達、内部的な通知、事実行為では処分性が否定されやすい一方、許認可、取消し、課税処分、営業停止などは処分性が認められやすいです。"),
      lecture("行政事件訴訟法", "原告適格の広がり", "原告適格は、処分の相手方だけでなく、法律上保護された利益を害される第三者にも認められる場合があります。周辺住民、競業者、施設利用者などが問題になります。条文の趣旨目的と保護利益を見ます。"),
      lecture("行政事件訴訟法", "訴えの利益が消える場面", "訴えの利益は、処分の取消しによって回復される利益があるかです。期間満了、処分の撤回、代替処分などで利益が消えることがあります。ただし、名誉や資格回復などの法律上の利益が残る場合は、訴えの利益が認められることがあります。"),
      lecture("行政事件訴訟法", "被告適格", "取消訴訟の被告は、原則として処分庁または裁決庁の所属する国または公共団体です。昔のように行政庁そのものを被告としない点が重要です。記述式では、誰を被告とするかを落とすと大きく失点します。"),
      lecture("行政事件訴訟法", "仮の救済", "行政事件訴訟では、判決まで待つと救済が間に合わないことがあります。そこで執行停止、仮の義務付け、仮の差止めが問題になります。取消訴訟とセットで執行停止、義務付け訴訟とセットで仮の義務付け、差止訴訟とセットで仮の差止めを押さえます。"),
      lecture("行政事件訴訟法", "申請型義務付け訴訟", "申請型義務付け訴訟は、申請に対して拒否処分がされた場合や、不作為がある場合に使います。拒否処分がある場合は、その取消訴訟または無効確認訴訟と併合提起します。不作為の場合は、不作為の違法確認訴訟と併合提起します。"),
      lecture("行政事件訴訟法", "非申請型義務付け訴訟", "非申請型義務付け訴訟は、申請権がない者が行政庁に一定の処分を求める訴訟です。重大な損害を生ずるおそれがあり、その損害を避けるため他に適当な方法がないことなどが問題になります。差止訴訟と要件が似ています。"),
      lecture("行政事件訴訟法", "差止訴訟と執行停止の違い", "差止訴訟は、まだ処分がされる前に、処分をさせないための訴訟です。執行停止は、すでに処分がされた後に、その効力や執行を一時的に止める制度です。処分前なら差止め、処分後なら執行停止、と時間軸で整理します。"),

      lecture("国家賠償法", "違法性の考え方", "国賠法1条の違法性は、行政処分の取消訴訟でいう違法と完全に同じではありません。公務員が職務上尽くすべき注意義務に違反したかが問題になります。規制権限不行使では、権限を行使しないことが著しく合理性を欠く場合に違法となり得ます。"),
      lecture("国家賠償法", "規制権限不行使", "行政庁が規制権限を持っているのに行使しなかった場合、いつでも国賠責任が生じるわけではありません。被害の重大性、予見可能性、権限行使の可能性、裁量の範囲などを見て、著しく合理性を欠く場合に違法となり得ます。"),
      lecture("国家賠償法", "国賠と損失補償", "国家賠償は違法な行政活動による損害を賠償する制度です。損失補償は、適法な公権力行使によって特別の犠牲を受けた場合に補償する制度です。違法なら国家賠償、適法だが特別犠牲なら損失補償、と区別します。"),

      lecture("地方自治法", "直接請求の全体像", "直接請求は、住民が地方政治に直接関与する制度です。条例制定改廃請求、監査請求、議会解散請求、議員や長の解職請求などがあります。50分の1と3分の1の違いをまず覚えます。"),
      lecture("地方自治法", "地方公共団体の種類", "地方公共団体には、普通地方公共団体と特別地方公共団体があります。普通地方公共団体は都道府県と市町村です。特別地方公共団体には特別区、地方公共団体の組合、財産区などがあります。"),
      lecture("地方自治法", "国と地方の関係", "国は地方公共団体に関与できますが、関与は法定主義に従います。助言、勧告、是正の要求、指示、代執行などがあります。国地方係争処理委員会など、国と地方の紛争処理制度もあります。"),
      lecture("地方自治法", "財務会計行為", "住民監査請求や住民訴訟で重要なのが財務会計行為です。公金の支出、財産の取得・管理・処分、契約の締結、債務負担などが対象になります。一般的な政策の違法ではなく、お金や財産に関わる行為だと意識します。"),

      lecture("行政法総論", "法律による行政の原理", "行政は法律に従って行われなければなりません。法律の留保は、行政活動に法律上の根拠が必要かという問題です。侵害行政では法律の根拠が強く要求されます。行政法の土台として、行政は自由に国民の権利を制限できないと理解します。"),
      lecture("行政法総論", "行政立法", "行政立法には、法規命令と行政規則があります。法規命令は国民の権利義務に関わる一般的ルールで、委任命令や執行命令があります。行政規則は行政内部のルールで、通達などが典型です。処分性との関係でも出ます。"),
      lecture("行政法総論", "行政計画と行政契約", "行政計画は、行政が将来の目標や方針を定めるものです。行政契約は、行政主体が契約形式で行政目的を実現するものです。行政計画や行政契約は抽象的で難しいため、200時間戦略では深追いせず、用語と典型例を押さえます。"),

      lecture("民法", "制限行為能力者", "制限行為能力者には、未成年者、成年被後見人、被保佐人、被補助人があります。取消しが基本効果です。相手方保護として、催告権、詐術による取消権制限などがあります。細かい同意権の範囲は頻出部分だけ押さえます。"),
      lecture("民法", "法人", "法人では、権利能力、代表機関、目的の範囲、不法行為責任が問題になります。一般社団法人や会社との細かい違いに深入りせず、法人は自然人とは別の権利主体であり、代表者の行為が法人に帰属することを押さえます。"),
      lecture("民法", "条件と期限", "条件は将来発生するか不確実な事実に法律効果をかからせるものです。期限は将来発生することが確実な事実です。停止条件、解除条件、始期、終期を区別します。短い知識ですが、肢別で出やすいです。"),
      lecture("民法", "占有権", "占有権は、物を事実上支配する状態を保護する権利です。占有訴権、即時取得、取得時効などとつながります。所有権とは別に、占有そのものが保護される点を理解します。"),
      lecture("民法", "即時取得", "即時取得は、動産取引の安全を守る制度です。取引行為によって、平穏・公然・善意無過失で動産の占有を始めた者は、前主が無権利者でも所有権を取得できます。不動産ではなく動産の制度です。"),
      lecture("民法", "留置権", "留置権は、他人の物を占有する者が、その物に関して生じた債権の弁済を受けるまで物を留置できる権利です。牽連性、弁済期、占有がキーワードです。担保物権の中では短く押さえます。"),
      lecture("民法", "債務不履行の損害賠償", "債務不履行による損害賠償では、債務不履行、損害、因果関係が必要です。債務者に帰責事由がなければ損害賠償責任を負いません。解除と損害賠償は併存し得る点が重要です。"),
      lecture("民法", "受領遅滞", "受領遅滞は、債権者が弁済の受領を拒み、または受領できない場合です。債務者の注意義務が軽減され、増加費用を債権者に請求できるなどの効果があります。債務不履行と反対側の問題として押さえます。"),
      lecture("民法", "委任・請負", "委任は法律行為などの事務処理を委託する契約で、受任者は善管注意義務を負います。請負は仕事の完成を目的とする契約です。委任は事務処理、請負は仕事完成、と区別します。"),
      lecture("民法", "親族の基本", "親族では、婚姻、離婚、親子、親権、扶養を押さえます。行政書士試験では細かい家族法に深入りしすぎず、法律婚、財産分与、親権、養子縁組などの基本を拾います。相続とつながる部分を優先します。"),

      lecture("憲法", "信教の自由", "信教の自由は、内心の信仰、宗教的行為、宗教的結社の自由を含みます。政教分離も重要です。目的効果基準など判例の枠組みが問われますが、まず国が特定宗教を援助・助長していないかを見ると理解しやすいです。"),
      lecture("憲法", "学問の自由", "学問の自由には、研究の自由、研究発表の自由、教授の自由、大学の自治が含まれます。大学の自治は、学問研究の自由を制度的に保障するものです。頻度は高くないですが、短く押さえると得点しやすい分野です。"),
      lecture("憲法", "生存権", "生存権は、健康で文化的な最低限度の生活を営む権利です。判例は、具体的な制度設計について立法府の広い裁量を認める傾向があります。プログラム規定か具体的権利かという学説に深入りせず、判例の結論を押さえます。"),
      lecture("憲法", "教育を受ける権利と労働基本権", "社会権では、教育を受ける権利、勤労の権利、労働基本権が出ます。労働基本権は、団結権、団体交渉権、団体行動権です。公務員の労働基本権制約も判例で問題になります。"),
      lecture("憲法", "地方自治", "憲法上、地方自治は制度として保障されています。地方公共団体には、議会を設置し、長や議員は住民が直接選挙します。地方自治の本旨には、住民自治と団体自治があります。地方自治法ともつながる分野です。"),

      lecture("基礎知識", "個人情報の用語整理", "個人情報、個人データ、保有個人データは段階的に整理します。個人情報は識別できる情報。個人データはデータベース等を構成する個人情報。保有個人データは事業者が開示等の権限を持つ個人データです。"),
      lecture("基礎知識", "マイナンバー", "マイナンバーは社会保障、税、災害対策の分野で利用されます。個人番号は厳格に扱われ、目的外利用や提供が制限されます。基礎知識では、個人情報保護とあわせて番号制度の基本目的を押さえます。"),
      lecture("基礎知識", "AIとデジタル社会", "AI、生成AI、アルゴリズム、ビッグデータ、クラウド、IoTなどの用語は基礎知識で狙われやすいです。技術の細部ではなく、何をする技術か、リスクは何か、個人情報や著作権との関係は何かを押さえます。"),
      lecture("基礎知識", "著作権の基本", "著作権では、著作物、著作者人格権、著作財産権、引用、私的使用、保護期間などを押さえます。行政書士試験では深い知財法ではなく、社会常識に近い基本用語として出ることがあります。"),
      lecture("基礎知識", "行政書士制度の狙い", "行政書士は、官公署提出書類や権利義務・事実証明書類を扱い、国民と行政の橋渡しをする専門職です。令和8年度は改正行政書士法の影響で、使命、職責、デジタル化、特定行政書士の位置づけが狙われます。"),

      lecture("商法・会社法", "商行為の基本", "商法では、商人、商行為、商号、商業登記などの基本があります。行政書士試験では会社法中心ですが、商人や商行為の基本用語が出ることがあります。深追いせず、用語を短く説明できる状態にします。"),
      lecture("商法・会社法", "株主総会", "株主総会は株式会社の基本的意思決定機関です。普通決議、特別決議、議決権、招集、議事録などが問題になります。細かい決議要件は頻出部分だけ確認し、取締役会との役割分担を押さえます。"),
      lecture("商法・会社法", "取締役会設置会社", "取締役会設置会社では、取締役会が業務執行の決定、取締役の職務執行の監督、代表取締役の選定・解職を行います。取締役会を置かない会社との違いが問われます。"),
      lecture("商法・会社法", "監査役", "監査役は取締役の職務執行を監査します。会計監査だけでなく業務監査も問題になります。監査役会、会計監査人などに深入りしすぎず、監査役は取締役を監査する機関と押さえます。"),

      lecture("基礎法学", "法解釈", "法解釈には、文理解釈、論理解釈、目的論的解釈、反対解釈、類推解釈などがあります。行政書士試験では、難しい理論より用語の意味が問われやすいです。条文をどう読むかの基本として押さえます。"),
      lecture("基礎法学", "裁判の効力", "判決の効力には、既判力、執行力、形成力などがあります。既判力は、確定判決の判断内容を後の裁判で争えなくする効力です。民事訴訟と行政事件訴訟の理解にもつながります。"),
      lecture("基礎法学", "法令用語", "法令用語では、又は、と、若しくは、及び、並びに、推定する、みなす、直ちに、速やかに、遅滞なく、などが出ます。問題文のひっかけにもなるので、直前に音声で反復すると効果があります。"),

      lecture("記述式", "行政法の典型テーマ", "行政法記述では、取消訴訟、裁決取消訴訟、義務付け訴訟、差止訴訟、執行停止、不作為の違法確認、理由提示、聴聞が典型です。制度名、被告、要件、効果を短く書く練習をします。"),
      lecture("記述式", "民法の典型テーマ", "民法記述では、詐欺取消し、錯誤取消し、代理、時効、債務不履行解除、契約不適合責任、賃貸借解除、不法行為、相続が典型です。問題文から法律構成を選び、効果を端的に書きます。"),
      lecture("記述式", "40字の作り方", "40字記述は、主語、相手、法律効果、要件の順で作ると安定します。例として、AはBに対し、詐欺を理由に意思表示を取り消すことができる、という形です。完璧な文章より、採点キーワードを入れることを優先します。")
    );

          <div class="lecture-actions">
            <button type="button" data-action="read" data-lecture-index="${index}">この講義を聞く</button>
            <button type="button" data-action="questions" data-category="${item.category}">関連問題へ</button>
          </div>
        </article>
      `).join("");
    }
    function lectureListForMode() {
      return lectures.map((item, index) => ({ item, index })).filter(({ index }) => {
        if (state.lectureMode === "advanced") return index >= BASIC_LECTURE_COUNT;
        if (state.lectureMode === "all") return true;
        return index < BASIC_LECTURE_COUNT;
      }).sort((a, b) => lectureSortKey(a) - lectureSortKey(b));
    }
    function lectureSortKey(entry) {
      const base = studyOrder.indexOf(entry.item.category);
      return (base < 0 ? 999 : base) * 1000 + entry.index;
    }
    function lectureModeLabel() {
      if (state.lectureMode === "advanced") return "応用編";
      if (state.lectureMode === "all") return "全件";
      return "基本編";
    }
    function switchView(name) {
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === name));
      document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
      el(name + "View").classList.add("active");
      if (name === "cards") renderCard();
      if (name === "guide") renderLectures();
      if (name === "progress") renderProgress();
    }
    function due(qn) { return qs(qn.id).dueAt <= Date.now(); }
    function categoryPool(category, mode) {
      let list = questions.filter((x) => category === "全分野" || x.category === category);
      if (mode === "due") list = list.filter(due);
      if (mode === "first") list = list.filter((x) => qs(x.id).attempts === 0);
      if (mode === "weak") list = list.filter((x) => qs(x.id).wrong > 0 || qs(x.id).level < 2);
      if (mode === "new") list = list.filter((x) => qs(x.id).attempts === 0);
      return list;
    }
    function nextCategoryWithQuestions(currentCategory, mode) {
      const start = Math.max(0, studyOrder.indexOf(currentCategory));
      for (let offset = 1; offset <= studyOrder.length; offset += 1) {
        const category = studyOrder[(start + offset) % studyOrder.length];
        if (categoryPool(category, mode).length) return category;
      }
      return "";
    }
    function advanceCategoryIfComplete() {
      const category = els.category.value;
      const mode = els.mode.value;
      if (category === "全分野" || !["first", "new"].includes(mode)) return;
      if (categoryPool(category, mode).length) return;
      const nextCategory = nextCategoryWithQuestions(category, mode);
      if (nextCategory) els.category.value = nextCategory;
    }
    function pool() {
      advanceCategoryIfComplete();
      const category = els.category.value;
      const mode = els.mode.value;
      let list = categoryPool(category, mode);
      if (!list.length) list = questions.filter((x) => category === "全分野" || x.category === category);
      return list.sort((a, b) => qs(a.id).dueAt - qs(b.id).dueAt || qs(a.id).level - qs(b.id).level || qs(a.id).correct - qs(b.id).correct);
    }
    function pick() {
      currentQuestion = pool()[0];
      renderQuestion();
    }
    function renderQuestion() {
      const s = qs(currentQuestion.id);
      els.qCat.textContent = currentQuestion.category;
      els.qStats.textContent = `正解 ${s.correct} / ミス ${s.wrong}`;
      els.qText.textContent = currentQuestion.prompt;
      els.choices.innerHTML = "";
      els.answer.classList.add("hidden");
      currentQuestion.choices.forEach((choice, i) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.type = "button";
        button.textContent = choice;
        button.addEventListener("click", () => answer(i));
        els.choices.appendChild(button);
      });
      speakQuestion(false);
    }
    function answer(i) {
      const buttons = [...els.choices.querySelectorAll(".choice")];
      buttons.forEach((b) => b.disabled = true);
      const ok = i === currentQuestion.answer;
      buttons[currentQuestion.answer].classList.add("correct");
      if (!ok) buttons[i].classList.add("wrong");
      const s = qs(currentQuestion.id);
      s.attempts += 1;
      state.answered += 1;
      if (ok) {
        s.correct += 1;
        s.level = Math.min(5, s.level + 1);
        s.dueAt = Date.now() + interval(s.level);
        state.correct += 1;
        state.streak += 1;
      } else {
        s.wrong += 1;
        s.level = Math.max(0, s.level - 1);
        s.dueAt = Date.now() + 5 * 60 * 1000;
        state.streak = 0;
      }
      els.result.textContent = ok ? "正解。本試験でも取りたい基本論点です。" : "不正解。5分後以降に優先して再出題します。";
      els.explain.textContent = currentQuestion.explain + " " + nextAction(currentQuestion.category, ok);
      els.answer.classList.remove("hidden");
      speakAnswer(ok);
      state.lastQuestionId = currentQuestion.id;
      state.lastCategory = currentQuestion.category;
      state.lastMode = els.mode.value || "first";
      save();
      renderStats();
    }
    function resumeLastQuestion() {
      const category = state.lastCategory || "全分野";
      els.category.value = categories.includes(category) ? category : "全分野";
      els.mode.value = "first";
      const scoped = questions.filter((question) => els.category.value === "全分野" || question.category === els.category.value);
      const lastIndex = scoped.findIndex((question) => question.id === state.lastQuestionId);
      const nextUnanswered = scoped.slice(Math.max(0, lastIndex + 1)).find((question) => qs(question.id).attempts === 0)
        || scoped.find((question) => qs(question.id).attempts === 0)
        || scoped[Math.max(0, lastIndex)] || questions[0];
      currentQuestion = nextUnanswered;
      switchView("learn");
      renderQuestion();
    }
    function goRelatedLecture(category) {
      switchView("guide");
      renderLectures();
      let target = [...el("lectureList").querySelectorAll(".tip")].find((tip) => tip.dataset.category === category);
      if (!target && state.lectureMode !== "all") {
        state.lectureMode = "all";
        save();
        renderLectures();
        target = [...el("lectureList").querySelectorAll(".tip")].find((tip) => tip.dataset.category === category);
      }
      document.querySelectorAll(".tip.focused").forEach((tip) => tip.classList.remove("focused"));
      if (target) {
        target.classList.add("focused");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        speak(target.innerText, true);
      }
    }
    function speechSupported() {
      return "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
    }
    function toggleAudio() {
      if (!speechSupported()) {
        els.audioToggle.textContent = "音声非対応";
        return;
      }
      state.audioOn = !state.audioOn;
      save();
      renderAudioButton();
      if (state.audioOn) speak("音声をオンにしました。問題文と選択肢を読み上げます。", true);
      else window.speechSynthesis.cancel();
    }
    function renderAudioButton() {
      if (!speechSupported()) {
        els.audioToggle.textContent = "音声非対応";
        els.readQuestion.textContent = "読み上げ不可";
        return;
      }
      els.audioToggle.textContent = state.audioOn ? "音声ON中・押すとOFF" : "音声OFF中・押すとON";
    }
    function speak(text, force = false) {
      if (!speechSupported()) return;
      if (!force && !state.audioOn) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = actualSpeechRate();
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }
    function actualSpeechRate() {
      const shownRate = Math.min(3, Math.max(0.8, Number(state.speechRate) || 1));
      if (shownRate <= 1) return shownRate;
      return 1 + (shownRate - 1) * 0.45;
    }
    function speakQuestion(force) {
      const choices = currentQuestion.choices.map((choice, index) => `${index + 1}番。${choice}`).join("。");
      speak(`${currentQuestion.category}の問題です。${currentQuestion.prompt}。選択肢。${choices}。`, force);
    }
    function speakAnswer(ok) {
      const correctChoice = currentQuestion.choices[currentQuestion.answer];
      const message = ok ? "正解です。" : "不正解です。";
      speak(`${message} 正解は、${currentQuestion.answer + 1}番、${correctChoice}。解説。${currentQuestion.explain}`, false);
    }
    function speakVisibleGuide() {
      const text = lectureListForMode().slice(0, 3).map(({ item }) => `${item.category}。${item.title}。${item.body}`).join("。");
      speak(text || "講義が見つかりません。", true);
    }
    function renderStats() {
      const levelSum = questions.reduce((sum, x) => sum + qs(x.id).level, 0);
      const mastery = Math.round(levelSum / (questions.length * 5) * 100);
      const dueCount = questions.filter(due).length;
      els.mastery.textContent = mastery + "%";
      els.due.textContent = dueCount;
      els.streak.textContent = state.streak;
      els.logged.textContent = firstPassStats().overall + "%";
      els.coach.textContent = comment(mastery, dueCount);
      renderProgress();
    }
    function totalMinutes() {
      return Object.values(state.minutes || {}).reduce((sum, value) => sum + value, 0);
    }
    function comment(mastery, dueCount) {
      const hours = totalMinutes() / 60;
      const first = firstPassStats();
      if (first.overall < 100) return `最優先は一周です。現在${first.overall}%完了。出題を「一周優先」にして、未回答を先に潰しましょう。`;
      if (!state.answered) return "まずは講義を1項目聞き、要点を3枚見て、一周優先で10問。最初は正答率より完走が大事です。";
      if (dueCount >= 8) return `復習が${dueCount}問あります。今は新規より、ミスした問題をつぶす方が得点に直結します。`;
      if (first.overall >= 100 && mastery < 45) return "一周完了。ここからは苦手優先で、正答率を上げる段階です。";
      if (mastery < 35) return "土台作り中です。行政手続法と不服審査法の短い知識を落とさない状態にしましょう。";
      if (mastery < 70) return "いい進み方です。ここからは行政事件訴訟法の要件と記述式テンプレを増やすと伸びます。";
      return "かなり仕上がっています。苦手優先で、ミスした肢だけを本試験前の得点源に変えましょう。";
    }
    function firstPassStats() {
      const questionDone = questions.filter((x) => qs(x.id).attempts > 0).length;
      const cardDone = Object.keys(state.cardsSeen || {}).length;
      const lectureDone = Object.keys(state.lecturesSeen || {}).length;
      const lectureTotal = BASIC_LECTURE_COUNT;
      const total = questions.length + cards.length + lectureTotal;
      const done = questionDone + Math.min(cardDone, cards.length) + Math.min(lectureDone, lectureTotal);
      return {
        questions: Math.round(questionDone / questions.length * 100),
        cards: Math.round(Math.min(cardDone, cards.length) / cards.length * 100),
        lectures: Math.round(Math.min(lectureDone, lectureTotal) / lectureTotal * 100),
        overall: Math.round(done / total * 100)
      };
    }
    function nextAction(category, ok) {
      if (ok) return "次は同じ分野をもう1問解いて、知識を固定しましょう。";
      const actions = {
        "行政手続法": "講義タブで「行政手続法」と「申請と不利益処分」を読み直してください。",
        "行政不服審査法": "講義タブで「行政不服審査法」を読み、却下・棄却・認容を口で説明してください。",
        "行政事件訴訟法": "講義タブで「行政事件訴訟法」と「訴訟の使い分け」を読み直してください。",
        "国家賠償法": "講義タブで「国家賠償法」を読み、1条と2条の違いを確認してください。",
        "地方自治法": "講義タブで「地方自治法」を読み、住民監査請求と住民訴訟を確認してください。",
        "行政法総論": "講義タブで「行政法総論」を読み、公定力・不可争力を確認してください。",
        "民法": "講義タブで「民法」を読み、要件・効果・誰に何を主張するかを確認してください。",
        "憲法": "講義タブで「憲法」を読み、人権判例と統治条文に絞って確認してください。",
        "基礎知識": "講義タブで「基礎知識」を読み、個人情報・情報通信・改正行政書士法を確認してください。",
        "商法・会社法": "講義タブで「商法・会社法」を読み、設立・株式・機関だけ確認してください。",
        "基礎法学": "講義タブで「基礎法学」を読み、法の分類と裁判制度を確認してください。",
        "記述式": "講義タブで「記述式の型」を読み、声に出して1回暗唱してください。"
      };
      return actions[category] || "講義タブで該当分野を読み直してください。";
    }
    function cardPool() {
      const category = els.cardCategory.value || "全分野";
      return cards.filter((x) => category === "全分野" || x.category === category);
    }
    function renderCard() {
      const list = cardPool();
      if (!list.length) {
        els.flashCat.textContent = "要点";
        els.flashFront.textContent = "この分野の要点カードはまだありません。";
        els.flashBack.textContent = "講義または問題から先に進めてください。";
        els.flashBack.classList.remove("hidden");
        return;
      }
      if (cardIndex >= list.length) cardIndex = 0;
      if (cardIndex < 0) cardIndex = list.length - 1;
      const card = list[cardIndex];
      els.flashCat.textContent = card.category;
      els.flashFront.textContent = card.front;
      els.flashBack.textContent = card.back;
      els.flashBack.classList.add("hidden");
      state.cardsSeen[`${card.category}:${card.front}`] = true;
      save();
      renderStats();
    }
    function renderProgress() {
      const first = firstPassStats();
      const header = `<article class="progress-item panel"><div class="progress-head"><span>一周進捗</span><span>${first.overall}%</span></div><div class="bar"><span style="width:${first.overall}%"></span></div><p class="small">講義 ${first.lectures}% / 要点 ${first.cards}% / 問題 ${first.questions}%。まずは100%まで急いで一周しましょう。</p></article>`;
      renderSubjectMap();
      els.progress.innerHTML = header + categories.map((category) => {
        const list = questions.filter((x) => x.category === category);
        const level = list.reduce((sum, x) => sum + qs(x.id).level, 0);
        const attempts = list.reduce((sum, x) => sum + qs(x.id).attempts, 0);
        const wrong = list.reduce((sum, x) => sum + qs(x.id).wrong, 0);
        const pct = list.length ? Math.round(level / (list.length * 5) * 100) : 0;
        const total = list.length || 1;
        const touched = list.filter((x) => qs(x.id).attempts > 0).length;
        const firstPct = Math.round(touched / total * 100);
        const status = firstPct >= 100 ? (pct >= 60 ? "Good" : "一周済。次は苦手優先") : "未完。一周優先";
        return `<article class="progress-item panel"><div class="progress-head"><span>${category}</span><span>${firstPct}%一周</span></div><div class="bar"><span style="width:${firstPct}%"></span></div><p class="small">理解度 ${pct}%。解答 ${attempts}回 / ミス ${wrong}回。判定：${status}</p></article>`;
      }).join("");
    }
    function renderSubjectMap() {
      els.subjectMap.innerHTML = categories.map((category) => {
        const qList = questions.filter((x) => x.category === category);
        const cList = cards.filter((x) => x.category === category);
        const lList = lectures.filter((x) => x.category === category);
        const qDone = qList.filter((x) => qs(x.id).attempts > 0).length;
        const cDone = cList.filter((x) => state.cardsSeen[`${x.category}:${x.front}`]).length;
        const lDone = lList.filter((x) => state.lecturesSeen[`${x.category}：${x.title}`] || state.lecturesSeen[`${x.category}:${x.title}`]).length;
        const level = qList.reduce((sum, x) => sum + qs(x.id).level, 0);
        const mastery = qList.length ? Math.round(level / (qList.length * 5) * 100) : 0;
        return `<article class="subject-row">
          <div>
            <strong>${category}</strong>
            <div class="subject-stats">
              <span>講義 ${percent(lDone, lList.length)}%</span>
              <span>要点 ${percent(cDone, cList.length)}%</span>
              <span>問題 ${percent(qDone, qList.length)}%</span>
              <span>理解 ${mastery}%</span>
            </div>
          </div>
          <button type="button" data-category="${category}">問題へ</button>
        </article>`;
      }).join("");
    }
    function percent(done, total) {
      if (!total) return 0;
      return Math.round(done / total * 100);
    }
    function categoryStatus(logged, plan, mastery) {
      if (!logged) return "未着手";
      if (logged > plan * 1.15 && mastery < 60) return "遅れ。講義を増やさず苦手問題へ";
      if (logged > plan * 1.15) return "時間超過。次科目へ";
      if (mastery >= 70) return "Good";
      if (logged >= plan * 0.7 && mastery < 45) return "遅れ気味";
      return "予定内";
    }
    setup();
  </script>
</body>
</html>
