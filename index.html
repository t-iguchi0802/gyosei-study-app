<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="theme-color" content="#176b5b">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>行政書士スマホ学習</title>
  <style>
    :root {
      --bg: #f4f6f1;
      --ink: #0b120e;
      --muted: #263229;
      --line: #dde4dc;
      --panel: #ffffff;
      --accent: #176b5b;
      --accent2: #9a5b22;
      --bad: #a43d2a;
      --good: #e8f3ee;
      --note: #fff6d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
      font-size: 18px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: env(safe-area-inset-top) 10px 88px;
    }
    .hero {
      position: sticky;
      top: 0;
      z-index: 3;
      margin: 0 -10px 10px;
      padding: 12px 10px 10px;
      background: rgba(244, 246, 241, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .label {
      margin: 0 0 2px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    button, select {
      min-height: 46px;
      font: inherit;
      border-radius: 8px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
    }
    .reset {
      min-width: 66px;
      padding: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }
    .metric {
      min-height: 70px;
      padding: 9px 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .metric strong {
      display: block;
      margin-top: 7px;
      font-size: 22px;
      line-height: 1;
    }
    .coach {
      margin-bottom: 10px;
      padding: 11px 12px;
      background: var(--note);
      border: 1px solid #ead687;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.55;
    }
    .exam180 {
      display: grid;
      gap: 9px;
      margin-bottom: 10px;
      padding: 12px;
      background: #ffffff;
      border: 2px solid #c9ddd6;
      border-radius: 8px;
    }
    .exam180 h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.35;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .score-box {
      padding: 9px 7px;
      background: #f5f7f2;
      border: 1px solid var(--line);
      border-radius: 8px;
      text-align: center;
    }
    .score-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .score-box strong {
      display: block;
      margin-top: 5px;
      font-size: 21px;
      line-height: 1;
    }
    .mission {
      padding: 10px;
      background: #fff6d8;
      border: 1px solid #ead687;
      border-radius: 8px;
      line-height: 1.6;
      font-weight: 800;
    }
    .route-list {
      display: grid;
      gap: 7px;
    }
    .route-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      background: #fafbf8;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .route-item strong {
      display: block;
      margin-bottom: 3px;
    }
    .route-item button {
      min-width: 70px;
      min-height: 52px;
      padding: 10px 12px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 900;
    }
    .today-block {
      display: grid;
      gap: 8px;
      padding: 10px;
      background: #f4fbf7;
      border: 1px solid #bdd9cf;
      border-radius: 8px;
    }
    .today-block h3,
    .risk-block h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }
    .today-route {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .today-route .order {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }
    .today-route strong {
      display: block;
      font-size: 16px;
      line-height: 1.35;
    }
    .today-route span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .today-route button {
      min-height: 48px;
      padding: 9px 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }
    .risk-block {
      display: grid;
      gap: 8px;
    }
    .risk-row {
      display: grid;
      grid-template-columns: 92px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
    }
    .risk-meter {
      height: 9px;
      overflow: hidden;
      background: #e7ece7;
      border-radius: 999px;
    }
    .risk-meter i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
    }
    .risk-bad { color: var(--bad); }
    .risk-warn { color: #8a5a00; }
    .risk-good { color: var(--accent); }
    .tabs {
      position: sticky;
      top: 74px;
      z-index: 4;
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 0 0 10px;
      padding: 7px;
      background: rgba(244, 246, 241, 0.97);
      border: 1px solid var(--line);
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    .tab {
      min-height: 48px;
      padding: 6px 3px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .view { display: none; }
    .view.active { display: block; }
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .study-log {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .study-log button {
      background: #fffaf0;
      border-color: #ead687;
      color: #5f4518;
      font-weight: 800;
    }
    .resume-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .resume-tools button,
    .answer-actions button {
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .answer-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .tip.focused {
      outline: 3px solid var(--accent);
      background: #f3fbf7;
    }
    .audio-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .audio-tools button {
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .global-audio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 10px;
    }
    .speed-control {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }
    .speed-control input {
      width: 100%;
    }
    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .question {
      padding: 14px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.48;
      letter-spacing: 0;
    }
    .choices {
      display: grid;
      gap: 9px;
    }
    .choice {
      width: 100%;
      min-height: 54px;
      padding: 12px;
      text-align: left;
      line-height: 1.45;
    }
    .choice.correct { background: var(--good); border-color: var(--accent); }
    .choice.wrong { background: #fff0ea; border-color: var(--bad); }
    .answer {
      margin-top: 12px;
      padding: 12px;
      background: #fafbf8;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.55;
    }
    .answer p { margin: 0 0 8px; }
    .writing-steps {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .writing-step {
      padding: 10px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .writing-step strong {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 15px;
    }
    .writing-step span {
      display: block;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.55;
      font-weight: 700;
    }
    .model-answer {
      background: #fffaf0;
      border-color: #ead687;
    }
    .model-answer span {
      color: #4a350d;
      font-weight: 900;
    }
    .keyword-check {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }
    .keyword-chip {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      padding: 9px;
      background: #f6faf7;
      border: 1px solid #c9ddd6;
      border-radius: 8px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }
    .keyword-chip input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }
    .primary {
      width: 100%;
      min-height: 56px;
      margin-top: 8px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }
    .card {
      min-height: 280px;
      padding: 16px;
    }
    .card .cat {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }
    .back {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 18px;
      line-height: 1.65;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .wide { grid-column: 1 / -1; }
    .progress-list, .tips {
      display: grid;
      gap: 9px;
    }
    .subject-map {
      display: grid;
      gap: 9px;
      margin-bottom: 10px;
    }
    .subject-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .subject-row strong {
      display: block;
      margin-bottom: 8px;
    }
    .subject-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .subject-stats span {
      padding: 5px 4px;
      background: #f5f7f2;
      border-radius: 6px;
      text-align: center;
    }
    .subject-row button {
      min-width: 64px;
      align-self: center;
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .lecture-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .lecture-actions button {
      background: #edf5f2;
      border-color: #c9ddd6;
      color: var(--accent);
      font-weight: 800;
    }
    .lecture-summary {
      padding: 12px;
      background: #fffaf0;
      border: 1px solid #ead687;
      border-radius: 8px;
      line-height: 1.55;
    }
    .lecture-summary strong {
      display: block;
      margin-bottom: 6px;
    }
    .guide-kind {
      margin-bottom: 9px;
    }
    .textbook {
      padding: 15px;
    }
    .textbook h3 {
      margin: 0 0 10px;
      font-size: 21px;
      line-height: 1.35;
    }
    .textbook-body {
      color: var(--ink);
      font-size: 17px;
      line-height: 1.8;
    }
    .textbook-body p {
      margin: 0 0 12px;
    }
    .textbook-body ul {
      margin: 8px 0 12px;
      padding-left: 1.2em;
    }
    .textbook-body li {
      margin: 5px 0;
    }
    .hl {
      background: #fff0b8;
      color: #11160f;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 800;
    }
    .key-red {
      color: #9b271b;
      font-weight: 900;
    }
    .key-blue {
      color: #175fa3;
      font-weight: 900;
    }
    .law-quote {
      margin: 10px 0 0;
      padding: 12px;
      background: #fafbf8;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      line-height: 1.75;
      white-space: pre-wrap;
    }
    .statute-label {
      display: inline-block;
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
    }
    .lecture-status {
      display: inline-block;
      margin: 8px 0 0;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f0f3ef;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }
    .tip.done {
      border-color: #b7d5ca;
      background: #f3fbf7;
    }
    .tip.done .lecture-status {
      background: #dcefe8;
      color: var(--accent);
    }
    .lecture-mode {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 9px;
    }
    .lecture-mode button {
      background: var(--panel);
      color: var(--muted);
      font-weight: 800;
    }
    .lecture-mode button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .progress-item, .tip {
      padding: 13px;
      line-height: 1.55;
    }
    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
      font-weight: 800;
    }
    .bar {
      height: 10px;
      overflow: hidden;
      background: #e8ece5;
      border-radius: 999px;
    }
    .bar span {
      display: block;
      height: 100%;
      background: var(--accent);
    }
    .small {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }
    .hidden { display: none; }
    @media (max-width: 350px) {
      h1 { font-size: 20px; }
      h2 { font-size: 20px; }
      .metric strong { font-size: 19px; }
      .tab { font-size: 14px; }
      .filters { grid-template-columns: 1fr; }
      .study-log { grid-template-columns: 1fr; }
      .resume-tools { grid-template-columns: 1fr; }
      .audio-tools { grid-template-columns: 1fr; }
      .global-audio { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-row">
        <div>
          <p class="label">行政書士試験</p>
          <h1>行政法スマホ学習</h1>
        </div>
        <button class="reset" id="resetButton" type="button">リセット</button>
      </div>
    </header>

    <section class="metrics" aria-label="学習状況">
      <div class="metric"><span>理解度</span><strong id="masteryText">0%</strong></div>
      <div class="metric"><span>復習</span><strong id="dueText">0</strong></div>
      <div class="metric"><span>連続</span><strong id="streakText">0</strong></div>
      <div class="metric"><span>一周</span><strong id="loggedText">0%</strong></div>
    </section>

    <section class="coach" id="coachText" aria-live="polite"></section>

    <section class="exam180" id="exam180Panel" aria-label="180点モード"></section>

    <section class="global-audio" aria-label="音声コントロール">
      <button id="audioToggleButton" type="button">音声 ON</button>
      <button id="stopAudioButton" type="button">音声を止める</button>
      <label class="speed-control">
        読む速さ
        <span id="speedText">1.0倍</span>
        <input id="speedRange" type="range" min="0.8" max="3" step="0.1" value="1">
      </label>
    </section>

    <nav class="tabs" aria-label="メニュー">
      <button class="tab active" type="button" data-view="learn">問題</button>
      <button class="tab" type="button" data-view="cards">要点</button>
      <button class="tab" type="button" data-view="progress">進捗</button>
      <button class="tab" type="button" data-view="guide">講義</button>
    </nav>

    <section class="view active" id="learnView">
      <div class="filters">
        <label>分野<select id="categoryFilter"></select></label>
        <label>出題<select id="modeFilter">
          <option value="due">復習優先</option>
          <option value="first">一周優先</option>
          <option value="weak">苦手優先</option>
          <option value="new">未学習優先</option>
          <option value="score180">180点優先</option>
          <option value="all">全範囲</option>
        </select></label>
      </div>
      <div class="resume-tools">
        <button id="resumeButton" type="button">前回の続きから始める</button>
        <button id="previousQuestionButton" type="button">前の問題へ</button>
      </div>
      <div class="study-log">
        <button id="log10Button" type="button">10分勉強した</button>
        <button id="log30Button" type="button">30分勉強した</button>
      </div>
      <div class="audio-tools">
        <button id="readQuestionButton" type="button">問題を聞く</button>
      </div>
      <article class="question panel">
        <div class="meta">
          <span id="questionCategory"></span>
          <span id="questionStats"></span>
        </div>
        <h2 id="questionText"></h2>
        <div class="choices" id="choices"></div>
        <div class="answer hidden" id="answerPanel">
          <p id="answerResult"></p>
          <div id="answerExplain"></div>
          <div class="answer-actions">
            <button id="relatedLectureButton" type="button">関連講義を読む</button>
          </div>
          <button class="primary" id="nextButton" type="button">次の問題</button>
        </div>
      </article>
    </section>

    <section class="view" id="cardsView">
      <div class="filters">
        <label class="wide">分野<select id="cardCategoryFilter"></select></label>
      </div>
      <article class="card panel">
        <p class="cat" id="flashCategory"></p>
        <h2 id="flashFront"></h2>
        <p class="back hidden" id="flashBack"></p>
      </article>
      <div class="row">
        <button id="showBackButton" type="button">答えを見る</button>
        <button id="nextCardButton" type="button">次へ</button>
        <button class="wide" id="prevCardButton" type="button">前へ</button>
      </div>
    </section>

    <section class="view" id="progressView">
      <div class="subject-map" id="subjectMap"></div>
      <div class="progress-list" id="progressList"></div>
    </section>

    <section class="view" id="guideView">
      <div class="audio-tools">
        <button id="readGuideButton" type="button">表示中の講義を聞く</button>
      </div>
      <div class="lecture-mode guide-kind" id="guideKindButtons">
        <button class="active" type="button" data-guide-kind="lecture">短文講義</button>
        <button type="button" data-guide-kind="textbook">体系テキスト</button>
        <button type="button" data-guide-kind="statutes">重要条文要約</button>
      </div>

      q("hou01", "基礎法学", "特別法と一般法の関係として正しいものはどれか。", ["特別法は一般法に優先する", "一般法は常に特別法に優先する", "後法は常に無効", "判例は常に法律に優先"], 0, "特別法は一般法に優先する。基礎法学は法の分類、裁判制度、法令用語を短時間で押さえる。"),
      q("hou02", "基礎法学", "民事訴訟について正しいものはどれか。", ["私人間の権利義務の確定を目的とする", "国家刑罰権の実現だけを目的とする", "被告人という用語を使う", "判決に既判力はない"], 0, "民事訴訟は私人間の権利義務の確定を目的とする。刑事訴訟との違いを押さえる。"),
      q("w02", "記述式", "処分の効力を一時的に止めたい場合に検討する手段はどれか。", ["執行停止の申立て", "直接請求", "戒告処分", "再調査の請求だけ"], 0, "重大な損害を避けるため緊急の必要があるとして、執行停止を申し立てる。"),
      q("w03", "記述式", "AがBにだまされて売買契約をした場合、Aの主張として最も適切なものはどれか。", ["詐欺を理由に意思表示を取り消せる", "契約は当然無効で何も不要", "錯誤無効だけを主張する", "解除しかできない"], 0, "民法記述では、誰が誰に何を主張できるかを40字で書く。詐欺取消しと第三者保護が頻出。"),
      q("w04", "記述式", "【行政法記述】営業停止処分を受けたXが、その処分自体を争う。最初に選ぶ答案骨子はどれか。", ["Xは処分庁所属の公共団体を被告として、営業停止処分の取消訴訟を提起する", "XはBに対し、契約解除を主張する", "Xは選挙管理委員会に解職請求をする", "Xは審査基準の制定を裁判所に求める"], 0, "出題意図：取消訴訟の基本型。制度：取消訴訟。当事者：Xが国または公共団体を被告。採点語：処分、取消訴訟、被告、違法。40字答案：XはYを被告として営業停止処分の取消訴訟を提起する。部分点：取消訴訟と被告を書けば拾える。"),
      q("w05", "記述式", "【行政法記述】処分後に期間が経過し、取消しても回復する利益がない。記述で最も意識すべき論点はどれか。", ["訴えの利益", "催告解除", "即時取得", "検閲禁止"], 0, "出題意図：取消訴訟の入口で落とす論点。制度：取消訴訟。当事者：原告X。採点語：訴えの利益、回復される法律上の利益。40字答案：取消判決で回復される法律上の利益がなく訴えの利益を欠く。部分点：訴えの利益という語で大きく拾う。"),
      q("w06", "記述式", "【行政法記述】申請を拒否されたXが、行政庁に許可処分をさせたい。最も点になる骨子はどれか。", ["拒否処分取消訴訟と申請型義務付け訴訟を併合提起する", "住民監査請求だけをする", "国家賠償法2条だけを主張する", "行政指導に従う義務を主張する"], 0, "出題意図：申請型義務付けの型。制度：義務付け訴訟。当事者：Xが行政庁側を被告。採点語：拒否処分取消訴訟、申請型義務付け、併合提起。40字答案：拒否処分取消訴訟と許可処分の義務付け訴訟を併合提起する。部分点：義務付けだけでなく取消訴訟とのセットを書く。"),
      q("w07", "記述式", "【行政法記述】行政庁が近く不利益処分をしそうで、処分前に止めたい。記述で使う制度はどれか。", ["差止訴訟", "不作為の違法確認訴訟", "裁決取消訴訟", "住民訴訟"], 0, "出題意図：処分前救済の選択。制度：差止訴訟。当事者：Xが国または公共団体を被告。採点語：差止訴訟、重大な損害、補充性。40字答案：重大な損害を避けるため、当該処分の差止訴訟を提起する。部分点：差止訴訟と重大な損害を書けば拾える。"),
      q("w08", "記述式", "【行政法記述】法令に基づく申請をしたのに行政庁が相当期間何もしない。最も適切な骨子はどれか。", ["不作為の違法確認訴訟を提起する", "事情判決を求める", "詐欺取消しを主張する", "条例制定請求をする"], 0, "出題意図：不作為救済の型。制度：不作為の違法確認訴訟。当事者：申請者X。採点語：法令に基づく申請、相当期間、不作為、違法確認。40字答案：Xは相当期間処分しない不作為の違法確認訴訟を提起する。部分点：不作為と相当期間を入れる。"),
      q("w09", "記述式", "【行政法記述】公務員が職務中に違法に損害を与えた。請求の骨子として最も適切なものはどれか。", ["国または公共団体に国家賠償法1条の損害賠償を請求する", "公務員個人に必ず取消訴訟を提起する", "行政代執行を請求する", "裁決固有の瑕疵を主張する"], 0, "出題意図：国賠1条の相手方。制度：国家賠償法1条。当事者：被害者Xが国または公共団体へ。採点語：公務員、職務、故意過失、違法、損害賠償。40字答案：Xは国又は公共団体に国賠法1条に基づき損害賠償請求できる。部分点：国または公共団体と1条を書く。"),
      q("w10", "記述式", "【行政法記述】道路の穴で通行人が負傷した。請求の骨子として最も適切なものはどれか。", ["公の営造物の設置管理の瑕疵として国家賠償法2条を使う", "審査請求期間の徒過を主張する", "処分基準の公表を求める", "無権代理の追認拒絶をする"], 0, "出題意図：国賠1条と2条の切分け。制度：国家賠償法2条。当事者：被害者Xが国または公共団体へ。採点語：公の営造物、設置管理の瑕疵、損害。40字答案：道路の設置管理の瑕疵を理由に国賠法2条で損害賠償請求する。部分点：営造物、瑕疵、2条を入れる。"),
      q("w11", "記述式", "【行政法記述】審査請求の裁決だけに理由不備がある。原処分の違法ではなく何を主張するか。", ["裁決取消訴訟で裁決固有の瑕疵を主張する", "処分取消訴訟で民法の解除を主張する", "住民訴訟で財務会計行為を争う", "行政指導の任意性だけを主張する"], 0, "出題意図：裁決取消訴訟の定番。制度：裁決取消訴訟。当事者：Xが裁決庁所属の国等を被告。採点語：裁決取消訴訟、裁決固有の瑕疵。40字答案：Xは裁決取消訴訟を提起し、理由不備という裁決固有の瑕疵を主張する。部分点：裁決固有の瑕疵を落とさない。"),
      q("w12", "記述式", "【民法記述】AがBの詐欺で売買契約をした。Aの答案骨子として最も点になるものはどれか。", ["AはBに対し、詐欺を理由に意思表示を取り消すことができる", "AはBに対し、常に無効を主張するだけでよい", "AはCに対し、常に対抗できる", "Aは行政庁に取消訴訟を提起する"], 0, "出題意図：民法記述の誰が誰に何を。制度：詐欺取消し。当事者：AがBへ。採点語：詐欺、意思表示、取消し、善意無過失の第三者。40字答案：AはBの詐欺を理由に売買の意思表示を取り消すことができる。部分点：詐欺と取消しで拾う。"),
      q("w13", "記述式", "【民法記述】無権代理人Bが本人Aの代理人として契約した。Aが契約を有効にしたくない場合の骨子はどれか。", ["Aは追認を拒絶でき、原則として契約の効果はAに帰属しない", "Aは必ず契約を追認しなければならない", "Aは取消訴訟を提起する", "Aは住民監査請求をする"], 0, "出題意図：代理記述の基本。制度：無権代理。当事者：本人A、相手方、無権代理人B。採点語：無権代理、追認拒絶、効果帰属しない。40字答案：Aは無権代理行為の追認を拒絶し、効果帰属を否定できる。部分点：追認拒絶と効果帰属を入れる。"),
      q("w14", "記述式", "【民法記述】賃借人が賃料を長期不払い。賃貸人が明渡しを狙う場合の答案骨子はどれか。", ["催告後も不履行なら解除し、建物明渡しを請求する", "直ちに自力で追い出す", "詐欺取消しだけを主張する", "行政事件訴訟を提起する"], 0, "出題意図：賃貸借解除の部分点回収。制度：債務不履行解除。当事者：賃貸人が賃借人へ。採点語：催告、相当期間、不履行、解除、明渡し。40字答案：賃貸人は催告後も不履行なら契約を解除し建物明渡しを請求できる。部分点：催告、解除、明渡しを入れる。"),
      q("w15", "記述式", "【民法記述】時効完成後、債務者が債務を承認した。債務者側の主張で問題になるものはどれか。", ["信義則上、時効の援用が制限され得る", "時効完成後も援用は常に自由", "債権は当然に消滅し主張不要", "処分性が必要になる"], 0, "出題意図：時効の記述で差がつく論点。制度：消滅時効。当事者：債務者、債権者。採点語：時効完成後、債務承認、信義則、援用権喪失。40字答案：時効完成後の債務承認により信義則上時効援用が制限され得る。部分点：援用と信義則を入れる。"),
      q("w16", "記述式", "【2026予測・行政法】申請拒否処分を受けたXが、取消しだけでなく許可を得るところまで狙う。最も点になる組合せはどれか。", ["拒否処分取消訴訟と申請型義務付け訴訟", "裁決取消訴訟と住民訴訟", "国家賠償法2条と事情判決", "行政指導の中止請求だけ"], 0, "予測理由：近年は訴訟選択と組合せが狙われやすい。出題意図：取消しで終わらず許可まで取る型。採点語：拒否処分取消訴訟、申請型義務付け、併合提起。40字答案：拒否処分取消訴訟と許可処分の義務付け訴訟を併合提起する。"),
      q("w17", "記述式", "【2026予測・行政法】行政庁が申請に対して相当期間応答しない。裁判で確認させるべき違法はどれか。", ["不作為の違法", "裁決固有の瑕疵", "公の営造物の瑕疵", "契約不適合"], 0, "予測理由：不作為は行政不服審査法と行政事件訴訟法を横断しやすい。出題意図：申請、相当期間、不作為を拾う。採点語：法令に基づく申請、相当期間、不作為の違法確認訴訟。40字答案：相当期間処分しない不作為の違法確認訴訟を提起する。"),
      q("w18", "記述式", "【2026予測・行政法】処分前に、重大な損害を避けるため行政庁の処分を止めたい。使う訴訟はどれか。", ["差止訴訟", "取消訴訟", "当事者訴訟", "住民訴訟"], 0, "予測理由：差止めは要件語が明確で記述式にしやすい。出題意図：処分前救済を選ぶ。採点語：差止訴訟、重大な損害、補充性。40字答案：重大な損害を避けるため当該処分の差止訴訟を提起する。"),
      q("w19", "記述式", "【2026予測・行政法】取消判決後、行政庁が同じ理由で同じ処分を繰り返そうとしている。記述で狙われる効力はどれか。", ["取消判決の拘束力", "即時取得", "検閲禁止", "時効の援用"], 0, "予測理由：行政事件訴訟法33条の拘束力は条文要約から記述へつなげやすい。出題意図：判決効を答案化する。採点語：取消判決、拘束力、関係行政庁、同一理由。40字答案：取消判決の拘束力により行政庁は同一理由で同じ処分をできない。"),
      q("w20", "記述式", "【2026予測・行政法】公務員の違法な職務行為で損害が生じた。誰に何を請求する答案が安全か。", ["国又は公共団体に国賠法1条の損害賠償請求", "公務員個人に取消訴訟", "行政庁に義務付け訴訟", "選挙管理委員会に解職請求"], 0, "予測理由：国賠1条は行政法記述で短く部分点化しやすい。出題意図：個人責任に飛びつかない。採点語：国又は公共団体、公務員、職務、故意過失、違法、損害。40字答案：国又は公共団体に国賠法1条に基づく損害賠償を請求する。"),
      q("w21", "記述式", "【2026予測・地方自治法】住民が自治体の違法な公金支出を裁判で争いたい。訴訟前に必要なものはどれか。", ["住民監査請求", "行政不服審査会への諮問", "聴聞", "審査基準の公表"], 0, "予測理由：住民監査請求前置は地方自治法の得点源。出題意図：住民訴訟の前提を落とさない。採点語：住民監査請求、住民訴訟、財務会計行為。40字答案：住民監査請求を経た上で違法な財務会計行為につき住民訴訟を提起する。"),
      q("w22", "記述式", "【2026予測・民法】買った物が契約内容に適合しない。買主がまず検討する請求として最も実戦的なものはどれか。", ["追完請求、代金減額請求、損害賠償、解除", "取消訴訟と執行停止", "住民監査請求", "審査請求だけ"], 0, "予測理由：契約不適合責任は改正民法後の定番で記述化しやすい。出題意図：旧瑕疵担保ではなく請求メニューを出す。採点語：契約不適合、追完、代金減額、損害賠償、解除。40字答案：買主は追完、代金減額、損害賠償又は解除を請求し得る。"),
      q("w23", "記述式", "【2026予測・民法】無権代理人が契約し、相手方が本人に返答を求めた。本人が放置した場合に問われやすい制度はどれか。", ["催告に対する確答がなければ追認拒絶とみなす", "当然に追認となる", "常に契約取消しとなる", "処分性が発生する"], 0, "予測理由：代理は短文で採点語を作りやすい。出題意図：追認、追認拒絶、催告を結びつける。採点語：無権代理、催告、確答、追認拒絶。40字答案：本人が相当期間内に確答しなければ追認拒絶とみなされる。"),
      q("w24", "記述式", "【2026予測・民法】賃料不払いで解除と明渡しを狙う。答案に最低限入れるべき語の組合せはどれか。", ["催告、相当期間、不履行、解除、明渡し", "検閲、事前抑制、明確性", "審査基準、標準処理期間、届出", "処分性、原告適格、事情判決だけ"], 0, "予測理由：賃貸借は記述で当事者と請求が作りやすい。出題意図：自力救済ではなく解除と明渡し。採点語：催告、相当期間、不履行、解除、明渡し。40字答案：催告後相当期間内に支払わなければ解除し建物明渡しを請求できる。"),
      q("w25", "記述式", "【2026予測・基礎知識連動】改正行政書士法を記述ではなく基礎知識で問われるなら、最優先で押さえる軸はどれか。", ["使命、職責、デジタル対応、特定行政書士", "裁決固有の瑕疵だけ", "契約不適合だけ", "検閲禁止だけ"], 0, "予測理由：2026年1月1日施行の改正行政書士法は今年度基礎知識で狙われやすい。出題意図：記述式ではなく足切り回避用に拾う。採点語：使命、職責、デジタル社会、特定行政書士、業務範囲。40字答案訓練ではなく、基礎知識の正誤判断で使う。"),
      q("b26", "基礎知識", "【足切り回避・行政書士法】令和8年度向けに、行政書士法で最も優先して押さえるべき組合せはどれか。", ["使命・職責・業務範囲・業務制限・特定行政書士", "処分性・原告適格・訴えの利益・事情判決・執行停止", "共有・相隣関係・占有訴権・即時取得・登記", "設立・株式・機関設計・取締役・代表取締役", "平等・表現の自由・職業選択・財産権・統治"], 0, "基礎知識の足切り回避用。行政書士法等業務関連諸法令は令和6年度以降の明示範囲。行政書士法は使命、職責、業務、業務制限、特定行政書士を正誤判断できるようにする。"),
      q("b27", "基礎知識", "【足切り回避・行政書士法】無資格者による業務制限で狙われやすい視点はどれか。", ["報酬を得て官公署提出書類等を業として作成する制限", "相談料名目なら官公署提出書類作成は常に自由となる", "行政書士法は試験制度と登録手続だけを定めている", "行政書士でない者も不服申立て代理を業としてできる", "業務制限は努力義務で罰則や取締りとは関係しない"], 0, "有料相談、代行、コンサル料など名目を変えた無資格業務が問われやすい。ポイントは、報酬、官公署提出書類等、業として、行政書士でない者の制限。"),
      q("b28", "基礎知識", "【足切り回避・戸籍法】戸籍法を基礎知識で問うなら、最も安全に押さえるべき軸はどれか。", ["身分関係を公証し、出生・婚姻・離婚・死亡を扱う", "居住関係を公証し、転入・転出・住民票だけを扱う", "会社関係を公証し、設立・役員・株式だけを扱う", "行政救済を定め、取消訴訟・義務付け訴訟を扱う", "情報管理を定め、個人情報保護委員会だけを扱う"], 0, "戸籍法は細かい条文暗記より、身分関係の公証、届出、出生・婚姻・離婚・死亡という骨格を押さえる。住民基本台帳法との区別が足切り回避に効く。"),
      q("b29", "基礎知識", "【足切り回避・住民基本台帳法】住民基本台帳制度の中心として最も近いものはどれか。", ["居住関係を公証し、住民票を行政事務の基礎にする", "身分関係を公証し、婚姻・離婚・死亡だけを扱う", "不服申立てを整理し、審査請求・裁決だけを扱う", "会社関係を公示し、機関・株式・登記だけを扱う", "刑事手続を整理し、起訴・証拠・判決だけを扱う"], 0, "住民基本台帳法は、住民の居住関係、住民票、行政事務の基礎という理解が中心。戸籍法は身分関係、住基法は居住関係で分ける。"),
      q("b30", "基礎知識", "【足切り回避・個人情報保護】個人情報に当たるものとして最も典型的なのはどれか。", ["氏名と住所が結びつき特定の個人を識別できる情報", "匿名化され個人へ戻せない統計処理後の情報", "法人番号と法人の売上高だけを並べた情報", "地域別の天気予報と気温だけをまとめた情報", "法律名と施行日だけを一覧にした公開情報"], 0, "個人情報保護は足切り回避の柱。個人を識別できる情報かどうかを見る。匿名加工・統計・法人情報との区別が本試験で狙われやすい。"),
      q("b31", "基礎知識", "【足切り回避・個人情報保護】要配慮個人情報として狙われやすいものはどれか。", ["病歴・犯罪歴・障害など差別や偏見につながり得る情報", "会社の資本金・本店所在地・代表者名だけの法人情報", "都道府県名・市町村名・郵便番号だけの地域情報", "商品の価格・型番・販売数量だけの商品情報", "道路の幅員・種別・路線名だけの公共施設情報"], 0, "病歴、犯罪歴、障害などは要配慮個人情報の代表。基礎知識では、普通の個人情報より慎重な取扱いが必要な情報として押さえる。"),
      q("b32", "基礎知識", "【足切り回避・情報通信】フィッシングの説明として最も適切なものはどれか。", ["偽サイトや偽メールでID・パスワード等を入力させる手口", "通信回線を増強し、アクセス速度や安定性を高める技術", "本人確認を不要にし、ログイン手続を省略する仕組み", "行政庁が処分理由を相手方に示す行政手続上の制度", "住民票を作成し、居住関係を公証する地方行政制度"], 0, "情報通信は毎年の足切り回避に効く。フィッシングは、偽サイト、偽メール、ID・パスワード、クレジット情報を奪う手口として押さえる。"),
      q("b33", "基礎知識", "【2026予測・生成AI】ディープフェイクに関する説明として妥当でないものはどれか。", ["本人確認を常に強化する安全技術であり、詐欺には利用されない", "画像だけでなく音声の合成やなりすましにも用いられる", "著名人だけでなく一般人の写真や音声も被害対象となり得る", "なりすまし広告や投資詐欺の信用付けに悪用され得る", "公式アカウントや公的機関情報の確認が被害防止に役立つ"], 0, "生成AI、ディープフェイク、なりすまし広告、投資詐欺は基礎知識の現代的テーマ。安全技術と決めつける選択肢は危険。"),
      q("b34", "基礎知識", "【足切り回避・情報セキュリティ】二要素認証の説明として最も適切なものはどれか。", ["知識・所持・生体など異なる要素を組み合わせる本人確認", "短いパスワードに統一して入力負担を減らす本人確認", "同じパスワードを複数サービスで使い回す本人確認", "本人確認を省略し、端末保存情報だけで通過させる仕組み", "行政処分を取り消すため裁判所に提起する訴訟類型"], 0, "二要素認証は、知識、所持、生体の異なる要素を組み合わせる。パスワード使い回し、短いパスワードは危険な選択肢。"),
      q("b35", "基礎知識", "【足切り回避・文章理解】長文問題で最初に見るべきものはどれか。", ["接続語・指示語・筆者の結論を示す文", "知らない専門用語・難読漢字・固有名詞", "選択肢に出た細かい数字・年号・割合", "本文の漢字の難しさ・句読点の多さ", "段落数・文字数・見出しの長さだけ"], 0, "文章理解は知識ではなく得点源。接続語、指示語、結論文を先に拾う。全部読んで迷うより、筆者の主張と段落関係を取る。"),
      q("b36", "基礎知識", "【足切り回避・文章理解】空欄補充で最も重視すべき判断材料はどれか。", ["空欄前後の接続関係と、同じ内容を言い換えた表現", "自分が読みやすい語感と、聞いたことがある表現", "選択肢の中で一番難しく見える専門用語", "本文に一度も出てこない新しいテーマの語句", "選択肢の文字数と、他の選択肢との見た目の差"], 0, "文章理解の空欄補充は、前後の論理関係を見る。逆接、順接、言い換え、具体例と抽象の関係を先に判断する。"),
      q("b37", "基礎知識", "【足切り回避・個人情報保護】行政機関が個人情報を扱う場面で、最も危険な理解はどれか。", ["行政目的なら本人や法律上の制限を無視して自由に利用できる", "利用目的の範囲を超える利用かどうかが問題になり得る", "漏えいや紛失を防ぐ安全管理措置が問題になり得る", "本人による開示や訂正の制度が問題になり得る", "漏えい等が発生した場合の報告や対応が問題になり得る"], 0, "個人情報保護は、行政機関でも自由利用ではない。利用目的、安全管理、本人関与、漏えい対応を正誤判断できるようにする。")
    ];
    function lecture(category, title, body) {
      return { category, title, body };

    function guideText(category, title, html) {

    function importantStatute(category, law, article, quote, point) {

    }
    const lectures = [
      lecture("行政手続法", "処分前のルール", "行政手続法は、行政庁が処分をする前の手続を整える法律です。申請に対する処分では、審査基準、標準処理期間、理由提示。不利益処分では、処分基準、聴聞、弁明、理由提示が中心です。まず、審査基準は申請、処分基準は不利益処分、という対応を固定してください。"),
      lecture("行政手続法", "行政指導と届出", "行政指導は任意の協力を求める行為です。従わないことを理由に不利益な取扱いをしてはいけません。届出は、形式上の要件を満たした書類が行政庁に到達した時点で、手続上の義務を履行したことになります。ここは短い知識で点にしやすい分野です。"),
      lecture("行政不服審査法", "行政内部で争う制度", "行政不服審査法は、行政内部で処分や不作為を争う制度です。審査請求期間は、処分を知った日の翌日から3か月以内、処分の日の翌日から1年以内です。審査請求をしても、処分の効力や執行は原則として止まりません。"),
      lecture("行政不服審査法", "裁決の結論", "裁決の結論は、却下、棄却、認容で整理します。不適法なら却下、理由がなければ棄却、理由があれば認容です。再調査の請求や再審査請求は、法律に定めがある場合だけ認められます。"),
      lecture("行政事件訴訟法", "取消訴訟の要件", "行政事件訴訟法は、裁判所で行政を争う制度です。取消訴訟では、処分性、原告適格、訴えの利益、被告適格、出訴期間が重要です。出訴期間は、処分を知った日から6か月以内、処分の日から1年以内です。被告は原則として、処分庁または裁決庁の所属する国または公共団体です。"),
      lecture("行政事件訴訟法", "訴訟類型の使い分け", "処分を取り消したいなら取消訴訟。無効を確認したいなら無効等確認訴訟。申請に応答しないなら不作為の違法確認訴訟。行政庁に処分させたいなら義務付け訴訟。処分させたくないなら差止訴訟です。裁決取消訴訟では、原則として裁決固有の瑕疵だけを主張します。"),
      lecture("国家賠償法", "1条と2条", "国家賠償法1条は、公務員が職務を行うについて、故意または過失により違法に損害を加えた場合です。責任を負うのは国または公共団体です。2条は、公の営造物の設置または管理の瑕疵による損害です。1条は公務員、2条は道路や河川などの施設、と分けます。"),
      lecture("地方自治法", "住民が関わる制度", "地方自治法は範囲が広いので、直接請求、住民監査請求、住民訴訟を優先します。条例制定改廃請求と監査請求は有権者の50分の1以上。議会解散請求や長の解職請求は原則として有権者の3分の1以上です。住民訴訟には住民監査請求の前置が必要です。"),
      lecture("行政法総論", "行政行為の効力", "行政法総論は抽象的なので、頻出語だけ押さえます。公定力は、取り消されるまで有効に扱われる効力。不可争力は、期間経過で私人から争えなくなる効力。行政裁量があっても、裁量の逸脱または濫用があれば違法になります。"),
      lecture("民法", "要件・効果で解く", "民法は、暗記よりも、要件、効果、誰が誰に何を主張できるかで解きます。優先順は、総則、代理、時効、物権変動、債権譲渡、債務不履行、解除、売買、賃貸借、不法行為、相続です。記述式では、詐欺取消し、代理、時効、解除、賃貸借、不法行為が狙われます。"),
      lecture("憲法", "人権判例と統治", "憲法は、人権判例と統治条文に絞ります。表現の自由、法の下の平等、職業選択の自由、財産権、適正手続、国会、内閣、裁判所、違憲審査が中心です。学説の深追いは避け、判例の結論と理由を短く押さえます。"),
      lecture("基礎知識", "足切り回避", "基礎知識は足切り回避が最優先です。文章理解、個人情報保護、情報通信、行政書士法等を優先します。令和8年度は、2026年1月1日施行の改正行政書士法に注意します。使命、職責、デジタル対応、特定行政書士、業務制限、両罰規定が狙い目です。"),
      lecture("商法・会社法", "深入りしない会社法", "商法会社法は、設立、株式、機関、取締役の義務と責任に絞ります。配点が大きくないため、難問に深入りすると全体戦略が崩れます。発起人、定款、株主総会、取締役、競業取引、利益相反取引を基本だけ押さえます。"),
      lecture("基礎法学", "直前暗記で拾う", "基礎法学は、法の分類、一般法と特別法、上位法と下位法、裁判制度、民事訴訟と刑事訴訟の違い、法令用語を短時間で確認します。ここで時間を使いすぎず、直前に拾う科目です。"),
      lecture("記述式", "型で部分点を取る", "記述式は満点狙いではなく部分点狙いです。取消訴訟型は、XはYを被告として、処分の取消訴訟を提起し、違法を主張する。裁決取消訴訟型は、裁決固有の瑕疵を主張する。民法は、誰が誰に何を請求または主張できるかを40字でまとめます。")
    ];
    lectures.push(
      lecture("行政手続法", "審査基準・標準処理期間", "申請に対する処分では、行政庁が審査基準を定め、原則として公にします。標準処理期間を定めたときは、公にしておくよう努めます。申請拒否処分では、原則として理由提示が必要です。審査基準、標準処理期間、理由提示をセットで覚えます。"),
      lecture("行政手続法", "聴聞と弁明", "不利益処分では、重大な処分なら聴聞、それ以外は弁明の機会付与が中心です。許認可の取消し、資格や地位の剥奪などは聴聞が出やすいです。聴聞は重い手続、弁明は軽い手続、とまず整理してください。"),
      lecture("行政不服審査法", "執行停止", "審査請求をしても、処分の効力や執行は原則として止まりません。止めたい場合は執行停止を考えます。行政事件訴訟法の執行停止と混同しやすいので、どちらも、処分は原則止まらない、必要があれば止める手続がある、と理解します。"),
      lecture("行政不服審査法", "審理員と審査会", "行政不服審査法では、原則として審理員が審理手続を行います。その後、行政不服審査会などの第三者機関がチェックする場面があります。処分をした側だけで終わらせないための公正さの仕組みです。"),
      lecture("行政事件訴訟法", "処分性", "取消訴訟は、処分性がなければ始まりません。処分性とは、行政庁の公権力の行使として、国民の権利義務に直接具体的な影響を与えることです。行政指導や内部行為は、原則として処分性が問題になります。"),
      lecture("行政事件訴訟法", "原告適格と訴えの利益", "原告適格は、その人に法律上保護された利益があるかで判断します。訴えの利益は、取消判決によって回復される利益が残っているかです。誰が争えるかが原告適格、今も争う意味があるかが訴えの利益です。"),
      lecture("行政事件訴訟法", "義務付け訴訟", "義務付け訴訟は、行政庁に一定の処分または裁決をすべきことを命じる訴訟です。申請型と非申請型があります。申請したのに拒否された、または応答がない場合は、取消訴訟や不作為の違法確認訴訟との組み合わせも意識します。"),
      lecture("行政事件訴訟法", "差止訴訟", "差止訴訟は、行政庁に一定の処分や裁決をさせないための訴訟です。重大な損害を生ずるおそれがあり、その損害を避けるため他に適当な方法がないことが重要です。重大な損害、補充性、処分前の救済という言葉で押さえます。"),
      lecture("行政事件訴訟法", "取消判決の効力", "取消判決には拘束力があります。行政庁は判決の趣旨に従って行動しなければなりません。第三者効も重要で、取消判決の効力は第三者にも及びます。事情判決は、処分は違法でも取消しが公共の福祉に適合しない場合の制度です。"),
      lecture("国家賠償法", "公務員個人の責任", "国賠法1条では、被害者に対して賠償責任を負うのは国または公共団体です。判例上、公務員個人は被害者に直接賠償責任を負いません。ただし、国または公共団体は、公務員に故意または重大な過失がある場合に求償できます。"),
      lecture("国家賠償法", "営造物責任", "国賠法2条の瑕疵とは、公の営造物が通常有すべき安全性を欠いていることです。道路、河川、学校施設などが典型です。費用、技術水準、危険の予見可能性なども判断要素になります。"),
      lecture("地方自治法", "条例と規則", "条例は議会の議決を経て制定され、法令に違反しない限り制定できます。規則は地方公共団体の長が制定します。条例は議会、規則は長、という役割分担を押さえます。"),
      lecture("地方自治法", "議会と長", "地方公共団体の議会は、条例制定、予算議決、決算認定などを行います。長は執行機関として事務を管理執行します。長には再議、専決処分などもありますが、最初は議会は議決、長は執行という骨格を押さえます。"),
      lecture("地方自治法", "住民監査請求と住民訴訟", "住民監査請求は、違法または不当な財務会計行為を対象にできます。住民訴訟は、違法な財務会計行為を対象とし、住民監査請求の前置が必要です。不当も含むのが監査請求、違法に絞られるのが住民訴訟です。"),
      lecture("行政法総論", "行政上の強制執行", "行政上の強制執行には、代執行、執行罰、直接強制、強制徴収があります。代執行は、代替的作為義務を行政庁が代わって行い費用を徴収する制度です。即時強制は、義務の存在を前提としない点で強制執行と区別します。"),
      lecture("民法", "意思表示", "意思表示では、心裡留保、虚偽表示、錯誤、詐欺、強迫を整理します。心裡留保は原則有効、相手方が真意でないことを知り又は知ることができたときは無効。詐欺と強迫は取消し。第三者保護の有無が頻出です。"),
      lecture("民法", "代理", "代理では、代理権、顕名、代理行為、効果帰属を押さえます。無権代理では、本人は追認または追認拒絶ができます。相手方には催告権や取消権が問題になります。表見代理は、本人側の帰責性と相手方の善意無過失が軸です。"),
      lecture("民法", "時効", "時効は、完成、援用、更新、完成猶予を押さえます。時効は完成しただけではなく、援用して初めて効果が確定します。時効完成後に債務を承認すると、信義則上、時効援用権を失うことがあります。"),
      lecture("民法", "物権変動", "不動産物権変動は、当事者間では意思表示で効力が生じますが、第三者に対抗するには登記が必要です。取消し、解除、取得時効などで登記の要否が問われます。民法では、誰が第三者かを丁寧に見ます。"),
      lecture("民法", "債務不履行と解除", "債務不履行では、履行遅滞、履行不能、不完全履行を整理します。解除は、催告解除が原則ですが、契約目的を達成できない場合など無催告解除が認められる場面もあります。解除しても、損害賠償請求は妨げられません。"),
      lecture("民法", "賃貸借", "賃貸借では、賃料不払い、修繕、転貸、敷金、解除が出やすいです。賃料不払いで解除する場合は、催告だけでなく、信頼関係が破壊されたかが問題になります。記述式でも、催告、相当期間、解除、明渡しが書けるようにします。"),
      lecture("民法", "不法行為", "不法行為は、故意または過失、権利または法律上保護される利益の侵害、損害、因果関係が要件です。使用者責任、共同不法行為、工作物責任も頻出ですが、まず基本不法行為の要件を落とさないことが大切です。"),
      lecture("民法", "相続", "相続では、相続人、相続分、遺産分割、遺言、遺留分、相続放棄を押さえます。行政書士試験では細かい親族相続に深入りしすぎず、基本的な相続人と相続分、放棄の効果を拾います。"),
      lecture("憲法", "表現の自由", "表現の自由では、検閲禁止、事前抑制、明確性、知る権利、報道の自由を押さえます。表現の自由は民主政の過程に関わるため重要です。規制目的と規制手段のバランスを判例の結論で確認します。"),
      lecture("憲法", "経済的自由", "職業選択の自由や財産権では、規制目的によって審査の厳しさが変わります。消極目的規制と積極目的規制の違いが有名です。学説に深入りせず、判例の結論を短く押さえます。"),
      lecture("憲法", "統治", "統治では、国会、内閣、裁判所を条文中心に押さえます。国会は国権の最高機関、唯一の立法機関。内閣は行政権を担い、国会に対して連帯責任を負います。裁判所は司法権を担い、違憲審査権を持ちます。"),
      lecture("基礎知識", "個人情報保護", "個人情報保護では、個人情報、個人データ、保有個人データ、要配慮個人情報を区別します。特定個人を識別できる情報が個人情報です。本人同意、第三者提供、安全管理措置もよく出ます。"),
      lecture("基礎知識", "情報通信", "情報通信では、フィッシング、ランサムウェア、二要素認証、暗号化、Cookie、クラウド、AIなどを押さえます。用語問題は短時間で点にしやすいため、音声で反復する価値があります。"),
      lecture("基礎知識", "文章理解", "文章理解は、知識ではなく読み方の問題です。接続詞、指示語、段落の役割を追い、本文に根拠がある選択肢を選びます。自分の意見に近い選択肢を選ばないことが重要です。"),
      lecture("基礎知識", "改正行政書士法", "令和8年度で注意したいのは、2026年1月1日施行の改正行政書士法です。行政書士の使命、職責、デジタル社会への対応、特定行政書士、業務範囲、無資格者規制、両罰規定を直前に確認します。"),
      lecture("商法・会社法", "株式会社の設立", "株式会社の設立では、発起人、定款、出資、設立時役員を押さえます。発起人は1人でもよく、定款作成は必要です。細かい手続より、基本用語と機関設計を優先します。"),
      lecture("商法・会社法", "株式と機関", "株式では、株主平等原則、譲渡制限株式、株主総会を押さえます。機関では、取締役、取締役会、監査役、会計参与などの役割を確認します。配点が小さいので、基本問題だけ取りに行きます。"),
      lecture("商法・会社法", "取締役の責任", "取締役は会社に対して善管注意義務と忠実義務を負います。競業取引や利益相反取引では承認が重要です。任務懈怠責任や第三者に対する責任は頻出ですが、深入りしすぎないようにします。"),
      lecture("基礎法学", "法の分類", "基礎法学では、公法と私法、実体法と手続法、一般法と特別法、強行法規と任意法規を確認します。特別法は一般法に優先する、上位法は下位法に優先する、という基本ルールが大切です。"),
      lecture("基礎法学", "裁判制度", "民事訴訟は私人間の権利義務の確定、刑事訴訟は国家刑罰権の実現が目的です。行政事件訴訟は行政を裁判所で争う制度です。用語の違いだけで得点できることがあります。")
    );
    lectures.push(
      lecture("行政事件訴訟法", "出訴期間と審査請求前置", "取消訴訟の出訴期間は、処分を知った日から6か月以内、処分の日から1年以内です。審査請求前置は原則不要ですが、個別法で前置が要求される場合があります。行政不服審査法の3か月と混同しないように、訴訟は6か月、審査請求は3か月と整理します。"),
      lecture("行政事件訴訟法", "不作為の違法確認訴訟", "不作為の違法確認訴訟は、法令に基づく申請に対して、行政庁が相当期間内に処分または裁決をしない場合に使います。何もしない行政を裁判所で争う制度です。義務付け訴訟と一緒に問われやすいので、応答がない、相当期間、申請という言葉に反応します。"),
      lecture("行政事件訴訟法", "当事者訴訟・民衆訴訟・機関訴訟", "当事者訴訟は、公法上の法律関係を争う訴訟です。民衆訴訟は、選挙訴訟や住民訴訟のように、法律に定めがある場合だけ認められます。機関訴訟は、国や公共団体の機関同士の争いです。主観訴訟と客観訴訟の区別が重要です。"),
      lecture("民法", "債権譲渡", "債権譲渡では、譲渡人から債務者への通知または債務者の承諾が対抗要件です。第三者対抗要件では、確定日付ある証書による通知または承諾が必要です。誰に対抗するのか、債務者か第三者かを分けて考えます。"),
      lecture("民法", "契約不適合責任", "売買で目的物が契約内容に適合しない場合、買主は追完請求、代金減額請求、損害賠償請求、解除を検討できます。まず追完、それが無理なら代金減額、重大なら解除という流れで理解します。旧瑕疵担保責任という言葉に引っ張られないようにします。"),
      lecture("民法", "相殺", "相殺は、互いに同種の債権を持つ場合に、一方的意思表示で対当額を消滅させる制度です。自働債権と受働債権を区別します。相殺禁止や差押えとの関係もありますが、まず同種債権、弁済期、一方的意思表示を押さえます。"),
      lecture("民法", "保証", "保証では、主債務と保証債務の関係を押さえます。保証債務は主債務に付従します。連帯保証では、催告の抗弁権や検索の抗弁権がありません。行政書士試験では、保証人がどこまで責任を負うかを聞かれます。"),
      lecture("民法", "共有", "共有では、保存行為、管理行為、変更行為を区別します。保存行為は各共有者が単独でできます。管理行為は持分価格の過半数。変更行為は原則として全員の同意が必要です。この数字と権限の違いが頻出です。"),
      lecture("民法", "抵当権", "抵当権は、債務者または第三者が占有を移さずに不動産を担保に供する担保物権です。付従性、随伴性、物上代位、法定地上権などが出ます。200時間戦略では、まず抵当権は占有を移さない担保、物上代位、法定地上権を押さえます。"),
      lecture("憲法", "法の下の平等", "法の下の平等では、合理的な理由のない差別が禁止されます。判例は、区別の目的や手段に合理性があるかを見ます。尊属殺重罰規定、議員定数不均衡、非嫡出子相続分などの判例が有名です。"),
      lecture("憲法", "適正手続と人身の自由", "適正手続では、刑罰や身体拘束に関する手続保障が問題になります。令状主義、黙秘権、弁護人依頼権、拷問禁止などを条文ベースで押さえます。細かい刑訴法知識ではなく、憲法上の保障として理解します。"),
      lecture("憲法", "財産権", "財産権は保障されますが、公共の福祉による制約を受けます。正当な補償の要否が問題になります。条例による制約、損失補償、規制と補償の関係を短く押さえます。"),
      lecture("基礎知識", "行政書士法の業務", "行政書士の業務は、官公署に提出する書類、権利義務または事実証明に関する書類の作成、提出手続代理、相談などが中心です。無資格者規制や業務制限も基礎知識で狙われます。改正法では使命や職責の文言にも注意します。"),
      lecture("基礎知識", "情報セキュリティ", "情報セキュリティでは、機密性、完全性、可用性を押さえます。マルウェア、ランサムウェア、フィッシング、標的型攻撃、ゼロデイ攻撃、二要素認証、バックアップが頻出です。用語を聞いて説明できる状態にします。"),
      lecture("基礎知識", "政治・経済・社会", "政治経済社会は範囲が広いので、深追いしません。行政、地方自治、財政、社会保障、選挙、国際機関などの基本語だけ拾います。時事は直前期に薄く確認し、文章理解と個人情報で安定点を取りに行きます。"),
      lecture("記述式", "行政法記述の書き方", "行政法記述は、訴訟類型、被告、要件、主張内容を短く書きます。誰が、誰を被告として、どの訴訟を提起し、何を主張するか、という順番で考えます。取消訴訟、義務付け訴訟、差止訴訟、執行停止、裁決固有の瑕疵が重要です。"),
      lecture("記述式", "民法記述の書き方", "民法記述は、要件と効果を40字前後で書きます。詐欺なら取り消せる、代理なら本人に効果帰属するか、賃貸借なら催告解除と明渡し、不法行為なら損害賠償請求、という形で、結論を先に決めてから要件を添えます。"),
      lecture("記述式", "部分点の取り方", "記述式は完璧な文章より、キーワードを落とさないことが大切です。取消訴訟、被告、裁決固有の瑕疵、重大な損害、緊急の必要、催告、解除、損害賠償など、採点されやすい語を入れます。わからない問題でも、制度名と効果を書いて部分点を狙います。")
    );
    lectures.push(
      lecture("行政手続法", "理由提示の狙い", "理由提示は、行政庁の判断を慎重にさせ、相手方に不服申立てや訴訟の準備をさせるための制度です。申請拒否処分でも不利益処分でも原則として理由提示が必要です。理由が抽象的すぎると違法が問題になります。"),
      lecture("行政手続法", "行政指導の限界", "行政指導は任意ですが、実際には圧力になりやすいので限界があります。相手方が行政指導に従わないことを理由に不利益取扱いをしてはいけません。また、許認可等の権限に関連して行政指導をする場合、相手方に誤解を与えない配慮が必要です。"),
      lecture("行政手続法", "申請処分の処理手順", "申請があったら、行政庁は遅滞なく審査を開始します。形式上の不備があれば補正を求めるか、拒否処分をします。申請者に不利な処分をする場合でも、申請拒否は不利益処分ではないため、聴聞や弁明ではなく理由提示が中心になります。"),
      lecture("行政手続法", "命令等と意見公募", "意見公募手続は、行政庁が命令等を定める場合に、案と関連資料を公示して意見を求める手続です。処分や行政指導とは違い、一般的ルールを作る場面です。命令等、案の公示、意見提出、結果公示をセットで覚えます。"),

      lecture("行政不服審査法", "審査請求の利益", "審査請求は、裁判より簡易迅速に行政内部で争える制度です。違法だけでなく不当も争える点が特徴です。取消訴訟は原則として違法性を争うため、不服審査の方が行政内部の再検討として広い意味を持ちます。"),
      lecture("行政不服審査法", "処分についての審査請求", "処分についての審査請求では、処分を取り消す、変更する、または一定の処分をすべきことを命じる裁決が問題になります。不適法なら却下、理由がなければ棄却、理由があれば認容です。結論語を間違えないことが重要です。"),
      lecture("行政不服審査法", "不作為についての審査請求", "不作為についての審査請求は、法令に基づく申請に対して行政庁が相当期間内に何もしない場合に使います。審査庁は、不作為が違法または不当なら、一定の処分をすべき旨を命じるなどの裁決をします。"),
      lecture("行政不服審査法", "審査請求と訴訟の違い", "審査請求は行政内部の手続、取消訴訟は裁判所の手続です。審査請求期間は処分を知った日の翌日から3か月、取消訴訟は処分を知った日から6か月です。不当まで見られるのが審査請求、違法性判断が中心なのが取消訴訟です。"),

      lecture("行政事件訴訟法", "処分性の判断例", "処分性では、行政庁の行為が国民の権利義務に直接具体的な法的効果を与えるかを見ます。行政指導、通達、内部的な通知、事実行為では処分性が否定されやすい一方、許認可、取消し、課税処分、営業停止などは処分性が認められやすいです。"),
      lecture("行政事件訴訟法", "原告適格の広がり", "原告適格は、処分の相手方だけでなく、法律上保護された利益を害される第三者にも認められる場合があります。周辺住民、競業者、施設利用者などが問題になります。条文の趣旨目的と保護利益を見ます。"),
      lecture("行政事件訴訟法", "訴えの利益が消える場面", "訴えの利益は、処分の取消しによって回復される利益があるかです。期間満了、処分の撤回、代替処分などで利益が消えることがあります。ただし、名誉や資格回復などの法律上の利益が残る場合は、訴えの利益が認められることがあります。"),
      lecture("行政事件訴訟法", "被告適格", "取消訴訟の被告は、原則として処分庁または裁決庁の所属する国または公共団体です。昔のように行政庁そのものを被告としない点が重要です。記述式では、誰を被告とするかを落とすと大きく失点します。"),
      lecture("行政事件訴訟法", "仮の救済", "行政事件訴訟では、判決まで待つと救済が間に合わないことがあります。そこで執行停止、仮の義務付け、仮の差止めが問題になります。取消訴訟とセットで執行停止、義務付け訴訟とセットで仮の義務付け、差止訴訟とセットで仮の差止めを押さえます。"),
      lecture("行政事件訴訟法", "申請型義務付け訴訟", "申請型義務付け訴訟は、申請に対して拒否処分がされた場合や、不作為がある場合に使います。拒否処分がある場合は、その取消訴訟または無効確認訴訟と併合提起します。不作為の場合は、不作為の違法確認訴訟と併合提起します。"),
      lecture("行政事件訴訟法", "非申請型義務付け訴訟", "非申請型義務付け訴訟は、申請権がない者が行政庁に一定の処分を求める訴訟です。重大な損害を生ずるおそれがあり、その損害を避けるため他に適当な方法がないことなどが問題になります。差止訴訟と要件が似ています。"),
      lecture("行政事件訴訟法", "差止訴訟と執行停止の違い", "差止訴訟は、まだ処分がされる前に、処分をさせないための訴訟です。執行停止は、すでに処分がされた後に、その効力や執行を一時的に止める制度です。処分前なら差止め、処分後なら執行停止、と時間軸で整理します。"),

      lecture("国家賠償法", "違法性の考え方", "国賠法1条の違法性は、行政処分の取消訴訟でいう違法と完全に同じではありません。公務員が職務上尽くすべき注意義務に違反したかが問題になります。規制権限不行使では、権限を行使しないことが著しく合理性を欠く場合に違法となり得ます。"),
      lecture("国家賠償法", "規制権限不行使", "行政庁が規制権限を持っているのに行使しなかった場合、いつでも国賠責任が生じるわけではありません。被害の重大性、予見可能性、権限行使の可能性、裁量の範囲などを見て、著しく合理性を欠く場合に違法となり得ます。"),
      lecture("国家賠償法", "国賠と損失補償", "国家賠償は違法な行政活動による損害を賠償する制度です。損失補償は、適法な公権力行使によって特別の犠牲を受けた場合に補償する制度です。違法なら国家賠償、適法だが特別犠牲なら損失補償、と区別します。"),

      lecture("地方自治法", "直接請求の全体像", "直接請求は、住民が地方政治に直接関与する制度です。条例制定改廃請求、監査請求、議会解散請求、議員や長の解職請求などがあります。50分の1と3分の1の違いをまず覚えます。"),

      lecture("記述式", "民法の典型テーマ", "民法記述では、詐欺取消し、錯誤取消し、代理、時効、債務不履行解除、契約不適合責任、賃貸借解除、不法行為、相続が典型です。問題文から法律構成を選び、効果を端的に書きます。"),

    const adminTextbooks = [
      guideText("行政法総論", "行政法全体の流れ", `
        <p>行政法は、国や地方公共団体が、国民に対してどのように権限を使い、その権限行使をどう争い、損害が出たときにどう救済するかを見る科目です。最初に押さえる軸は、<span class="hl">行政作用</span>、<span class="hl">行政手続</span>、<span class="hl">行政救済</span>の三つです。</p>
        <p>行政作用では、行政庁が一方的に法律関係を動かす<span class="key-red"><u>行政行為</u></span>が中心です。許可、認可、免許、取消し、課税処分などが典型です。ここでは、公定力、不可争力、不可変更力、自力執行力という効力を、難しい言葉としてではなく、<u>処分が取り消されるまでは有効に扱われる</u>という実務上の流れで理解します。</p>
        <p>次に行政手続法です。これは、行政庁が処分をする前に、相手方にどのようなルールで向き合うべきかを定めます。つまり、あとで争う法律ではなく、<span class="key-blue">処分前の公正さを確保する法律</span>です。</p>
        <p>行政救済は二段階で見ます。行政内部で争うのが行政不服審査法、裁判所で争うのが行政事件訴訟法です。さらに、違法な行政活動で損害が出たときは国家賠償法、公の施設の瑕疵なら国家賠償法2条を使います。地方自治法は、住民が自治体の財務行為を監査請求・住民訴訟で争う場面が得点源です。</p>
        <p>行政法総論では、<span class="hl">処分性</span>、<span class="hl">裁量</span>、<span class="hl">行政強制</span>、<span class="hl">行政契約・行政指導</span>を、各法律に接続するための土台として使います。とくに行政代執行法は、義務を履行しない者に対して行政庁が代わって実現する制度で、戒告、代執行令書、代執行、費用徴収という流れで覚えます。</p>
      `),
      guideText("行政手続法", "行政手続法とは何か", `
        <p>行政手続法は、<span class="key-red"><u>処分・行政指導・届出・命令等</u></span>について、行政庁が守るべき共通ルールを定める法律です。目的は、行政運営の公正の確保と透明性の向上です。試験では、この目的から各制度の位置づけを考えると崩れません。</p>
        <p>第一の柱は、<span class="hl">申請に対する処分</span>です。申請とは、許認可などを求める行為です。行政庁は、審査基準を定めて原則公にし、標準処理期間を定めたときは公にするよう努めます。申請を拒否するなら、原則として理由を示します。ここでは、<u>審査基準は申請側、処分基準は不利益処分側</u>という対応を絶対に固定します。</p>
        <p>第二の柱は、<span class="hl">不利益処分</span>です。不利益処分は、許可取消し、資格剥奪、営業停止のように、相手方に不利益を与える処分です。行政庁は処分基準を定め、公にするよう努めます。そして重大な不利益処分では聴聞、それ以外では弁明の機会付与が問題になります。<span class="key-blue">聴聞は重い手続、弁明は軽い手続</span>です。</p>
        <p>第三の柱は、行政指導です。行政指導は、相手方の任意の協力を求めるものです。だから、従わないことを理由に不利益取扱いをしてはいけません。行政指導を求められた側は、趣旨・内容・責任者を明らかにするよう求めることができます。</p>
        <p>第四の柱は、届出と命令等です。届出は、形式上の要件を満たして行政庁に到達した時点で義務履行となります。命令等を定めるときは意見公募手続が問題になります。ここは、個別処分ではなく、一般的なルール作りの場面だと理解します。</p>
      `),
      guideText("行政不服審査法", "行政不服審査法とは何か", `
        <p>行政不服審査法は、行政庁の処分や不作為について、<span class="key-red"><u>裁判所に行く前または裁判所とは別に、行政内部で争う制度</u></span>です。裁判より簡易迅速で、違法だけでなく不当も問題にできる点が特徴です。</p>
        <p>入口は二つです。一つは、処分に不服がある場合の審査請求。もう一つは、法令に基づく申請をしたのに行政庁が相当期間内に何もしない場合の、不作為についての審査請求です。期間は、処分を知った日の翌日から3か月以内、処分の日の翌日から1年以内をまず覚えます。</p>
        <p>審査請求をしても、処分の効力や執行は原則として止まりません。これを<span class="hl">執行不停止の原則</span>と考えます。止めたいときに執行停止が問題になります。行政事件訴訟法の執行停止と混同しやすいので、どちらも「処分は原則止まらない、必要なら止める手続を申し立てる」と整理します。</p>
        <p>審理では、審理員、弁明書、反論書、口頭意見陳述、証拠書類の閲覧などが出ます。最後の裁決は、<span class="key-blue">却下・棄却・認容</span>です。不適法なら却下、理由がなければ棄却、理由があれば認容。この三語は反射で出せるようにします。</p>
        <p>裁決には拘束力があります。つまり、関係行政庁は裁決の趣旨に従わなければなりません。行政不服審査法は、単なる相談制度ではなく、行政内部で処分を見直させる正式な救済制度です。</p>
      `),
      guideText("行政事件訴訟法", "行政事件訴訟法とは何か", `
        <p>行政事件訴訟法は、行政を<span class="key-red"><u>裁判所で争うための法律</u></span>です。まず、行政事件訴訟には、抗告訴訟、当事者訴訟、民衆訴訟、機関訴訟があります。行政書士試験で中心になるのは、行政庁の公権力の行使を争う抗告訴訟です。</p>
        <p>抗告訴訟の中心は取消訴訟です。取消訴訟では、最初に<span class="hl">処分性</span>が問題になります。処分性とは、行政庁の公権力の行使として、国民の権利義務に直接具体的な法的効果を及ぼすことです。行政指導、内部行為、事実行為では処分性が争点になりやすいです。</p>
        <p>次に、誰が訴えられるかという<span class="hl">原告適格</span>、今も争う意味があるかという<span class="hl">訴えの利益</span>、誰を被告にするかという<span class="hl">被告適格</span>、そして<span class="hl">出訴期間</span>を確認します。出訴期間は、処分または裁決があったことを知った日から6か月以内、処分または裁決の日から1年以内です。</p>
        <p>取消訴訟以外では、無効等確認、不作為の違法確認、義務付け、差止めを使い分けます。申請に応答しないなら不作為の違法確認、行政庁に処分させたいなら義務付け、処分させたくないなら差止めです。</p>
        <p>判決の効力では、<span class="key-blue">形成力・拘束力・第三者効</span>を押さえます。特に取消判決の拘束力は重要です。行政庁は同じ理由で同じ処分を繰り返せません。事件訴訟法は、要件を順番にチェックする科目です。</p>
      `),

        const firstPct = Math.round(touched / total * 100);
        const status = firstPct >= 100 ? (pct >= 60 ? "Good" : "一周済。次は苦手優先") : "未完。一周優先";
        return `<article class="progress-item panel"><div class="progress-head"><span>${category}</span><span>${firstPct}%一周</span></div><div class="bar"><span style="width:${firstPct}%"></span></div><p class="small">理解度 ${pct}%。解答 ${attempts}回 / ミス ${wrong}回。判定：${status}</p></article>`;
      }).join("");
    }
    function renderSubjectMap() {
      els.subjectMap.innerHTML = categories.map((category) => {
        const qList = questions.filter((x) => x.category === category);
        const cList = cards.filter((x) => x.category === category);
        const lList = lectures.filter((x) => x.category === category);
        const qDone = qList.filter((x) => qs(x.id).attempts > 0).length;
        const cDone = cList.filter((x) => state.cardsSeen[`${x.category}:${x.front}`]).length;
        const lDone = lList.filter(isLectureDone).length;
        const level = qList.reduce((sum, x) => sum + qs(x.id).level, 0);
        const mastery = qList.length ? Math.round(level / (qList.length * 5) * 100) : 0;
        return `<article class="subject-row">
          <div>
            <strong>${category}</strong>
            <div class="subject-stats">
              <span>講義 ${percent(lDone, lList.length)}%</span>
              <span>要点 ${percent(cDone, cList.length)}%</span>
              <span>問題 ${percent(qDone, qList.length)}%</span>
              <span>理解 ${mastery}%</span>
            </div>
          </div>
          <button type="button" data-category="${category}">問題へ</button>
        </article>`;
      }).join("");
    }
    function percent(done, total) {
      if (!total) return 0;
      return Math.round(done / total * 100);
    }
    function categoryStatus(logged, plan, mastery) {
      if (!logged) return "未着手";
      if (logged > plan * 1.15 && mastery < 60) return "遅れ。講義を増やさず苦手問題へ";
      if (logged > plan * 1.15) return "時間超過。次科目へ";
      if (mastery >= 70) return "Good";
      if (logged >= plan * 0.7 && mastery < 45) return "遅れ気味";
      return "予定内";
    }
    setup();
  </script>
</body>
</html>
